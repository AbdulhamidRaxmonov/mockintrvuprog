<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MockInterview Pro 🎯</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#6C63FF;--pr2:#8B85FF;--sc:#FF6584;--ac:#43E97B;--ac2:#38F9D7;
  --bg:#0A0B14;--card:#12131F;--card2:#1A1B2E;
  --t1:#FFFFFF;--t2:#A0A3B1;--t3:#6B6E82;
  --br:#2A2B3D;--gold:#FFD700;--red:#FF4D6A;--blue:#4DC3FF;--yel:#FFB84D;
  --tr:all .3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--br);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--pr)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(108,99,255,.5)}50%{transform:scale(1.04);box-shadow:0 0 0 16px rgba(108,99,255,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(108,99,255,.3)}50%{box-shadow:0 0 50px rgba(108,99,255,.8)}}
@keyframes ripple{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes barAnim{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* UTILITY */
.fade-up{animation:fadeUp .6s ease forwards}
.bounce-in{animation:bounceIn .5s cubic-bezier(.175,.885,.32,1.275) forwards}
.float{animation:float 3s ease-in-out infinite}

/* GRADIENT TEXT */
.gt{
  background:linear-gradient(135deg,#6C63FF 0%,#FF6584 50%,#43E97B 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:grad 4s ease infinite;
}

/* GLASS CARD */
.card{
  background:rgba(18,19,31,.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.card:hover{border-color:rgba(108,99,255,.25)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;
  font-size:15px;font-weight:600;cursor:pointer;transition:var(--tr);padding:12px 28px}
.btn-pr{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.btn-pr:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,.5)}
.btn-pr:active{transform:translateY(0)}
.btn-pr:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-sc{background:rgba(108,99,255,.12);color:var(--pr2);border:1px solid rgba(108,99,255,.3)}
.btn-sc:hover{background:rgba(108,99,255,.22);border-color:var(--pr)}
.btn-gr{background:linear-gradient(135deg,#43E97B,#38F9D7);color:#0A0B14}
.btn-gr:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(67,233,123,.4)}
.btn-rd{background:linear-gradient(135deg,#FF4D6A,#FF6584);color:#fff}
.btn-rd:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,77,106,.4)}
.btn-pulse{animation:pulse 2s infinite}

/* INPUTS */
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--br);
  color:var(--t1);padding:12px 16px;border-radius:10px;font-size:15px;
  font-family:inherit;outline:none;transition:var(--tr)}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
textarea.inp{resize:vertical}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.b-gr{background:rgba(67,233,123,.15);color:#43E97B;border:1px solid rgba(67,233,123,.3)}
.b-bl{background:rgba(77,195,255,.15);color:#4DC3FF;border:1px solid rgba(77,195,255,.3)}
.b-yl{background:rgba(255,184,77,.15);color:#FFB84D;border:1px solid rgba(255,184,77,.3)}
.b-pro{background:linear-gradient(135deg,#FFD700,#FFA500);color:#0A0B14}

/* PROGRESS */
.prog-wrap{height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .8s ease}

/* VOICE BARS */
.vbar{width:4px;background:var(--pr);border-radius:2px;transform-origin:bottom;
  animation:barAnim .7s ease-in-out infinite}

/* NAVBAR */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:14px 32px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,11,20,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.05);transition:var(--tr)}
.nav.scrolled{background:rgba(10,11,20,.97)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.nav-logo-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--pr),var(--sc));
  display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-logo span{font-weight:800;font-size:18px}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{background:transparent;border:none;color:var(--t2);padding:8px 16px;
  border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:var(--tr)}
.nav-link:hover,.nav-link.active{color:var(--pr);background:rgba(108,99,255,.12)}
.nav-auth{display:flex;align-items:center;gap:10px}

/* PAGES */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* SECTIONS */
section{padding:80px 20px}
.container{max-width:1200px;margin:0 auto}
.sec-title{font-size:clamp(26px,4.5vw,46px);font-weight:900;margin-bottom:12px}
.sec-sub{color:var(--t2);font-size:16px}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:100px 20px 60px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none}
.hero h1{font-size:clamp(36px,7vw,80px);font-weight:900;line-height:1.1;margin-bottom:24px}
.hero p{font-size:clamp(16px,2.5vw,20px);color:var(--t2);max-width:640px;line-height:1.8;margin-bottom:48px}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:64px}
.stats-row{display:flex;gap:48px;flex-wrap:wrap;justify-content:center}
.stat-item{text-align:center}
.stat-num{font-size:32px;font-weight:800;color:var(--pr)}
.stat-lab{font-size:13px;color:var(--t3)}

/* GRID CARDS */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.feat-card{padding:28px;transition:var(--tr);cursor:pointer}
.feat-card:hover{transform:translateY(-4px);border-color:rgba(108,99,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.feat-icon{font-size:36px;margin-bottom:16px}
.feat-card h3{font-size:18px;font-weight:700;margin-bottom:8px}
.feat-card p{color:var(--t2);font-size:14px;line-height:1.65}

/* LEVEL CARDS */
.level-card{padding:32px;cursor:pointer;transition:var(--tr)}
.level-card:hover{transform:translateY(-5px)}
.level-icon-box{width:60px;height:60px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:18px}

/* TESTIMONIALS */
.test-card{padding:28px}
.test-avatar{width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--pr),var(--sc));
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}

/* TECH PILLS */
.tech-pill{padding:10px 22px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;transition:var(--tr)}
.tech-pill:hover{transform:translateY(-2px);border-color:var(--pr)!important}

/* SETUP PAGE */
.setup-wrap{max-width:800px;margin:0 auto;padding:110px 20px 60px}
.steps-row{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:48px}
.step-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;transition:var(--tr)}
.step-line{width:80px;height:2px;margin:0 4px;margin-bottom:22px;transition:var(--tr)}
.step-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.step-lab{font-size:12px;transition:var(--tr)}
.sel-card{padding:22px;cursor:pointer;transition:var(--tr)}

/* VOICE INTERVIEW */
.vi-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.vi-header{position:fixed;top:0;left:0;right:0;padding:14px 28px;z-index:100;
  background:rgba(10,11,20,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between}
.vi-progbar{position:fixed;top:58px;left:0;right:0;height:3px;background:var(--br)}
.vi-progress{height:100%;background:linear-gradient(90deg,var(--pr),var(--sc));transition:width .6s ease}
.vi-body{padding:90px 20px 40px;max-width:760px;margin:0 auto;width:100%}
.ai-avatar{width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg,var(--pr),var(--sc));
  display:flex;align-items:center;justify-content:center;font-size:50px;margin:0 auto;
  box-shadow:0 0 20px rgba(108,99,255,.2);transition:box-shadow .3s}
.ai-avatar.speaking{box-shadow:0 0 50px rgba(108,99,255,.7);animation:glow 1s ease-in-out infinite}
.ripple-ring{position:absolute;inset:-10px;border-radius:50%;
  border:3px solid rgba(108,99,255,.4);animation:ripple 1.5s ease-out infinite}
.voice-bars{display:flex;align-items:flex-end;gap:4px;height:36px}
.q-card{padding:28px;margin-bottom:20px;text-align:center}
.q-card h2{font-size:20px;font-weight:700;line-height:1.6}
.ans-card{padding:20px;margin-bottom:20px;min-height:90px}
.fb-card{padding:20px;margin-bottom:20px;border-radius:14px}
.score-dots{display:flex;gap:8px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.score-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;border:2px solid}

/* CODING INTERVIEW */
.ci-wrap{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.ci-header{padding:12px 20px;background:rgba(10,11,20,.97);border-bottom:1px solid var(--br);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ci-body{flex:1;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.ci-left{border-right:1px solid var(--br);overflow-y:auto;padding:20px}
.ci-right{display:flex;flex-direction:column;overflow:hidden}
.ci-num{display:flex;gap:6px}
.ci-num-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--br);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.04);color:var(--t3);transition:var(--tr)}
.ci-num-btn.active{background:rgba(108,99,255,.25);border-color:var(--pr);color:var(--pr)}
.ci-num-btn.solved{background:rgba(67,233,123,.15);border-color:#43E97B;color:#43E97B}
.code-area{flex:1;font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;
  line-height:1.7;background:#0C0D1A;color:#E2E4FF;border:none;outline:none;
  padding:18px;resize:none;tab-size:2;overflow-y:auto}
.output-box{background:#07080F;border-top:1px solid var(--br);padding:14px 16px;
  font-family:'JetBrains Mono',monospace;font-size:12px;min-height:100px;
  white-space:pre-wrap;overflow-y:auto;max-height:160px}
.ci-run-bar{padding:12px 16px;background:#0D0E1A;display:flex;gap:10px;border-top:1px solid var(--br);flex-shrink:0}
.dot-row{display:flex;gap:5px}
.mac-dot{width:12px;height:12px;border-radius:50%}

/* RESULTS */
.res-wrap{max-width:960px;margin:0 auto;padding:100px 20px 60px}
.score-ring{width:200px;height:200px;border-radius:50%;margin:0 auto;
  display:flex;align-items:center;justify-content:center;position:relative}
.score-inner{position:absolute;inset:18px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:52px;font-weight:900}
.tab-row{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:24px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:500;
  cursor:pointer;background:transparent;color:var(--t2);transition:var(--tr)}
.tab-btn.active{background:rgba(108,99,255,.16);color:var(--pr);border:1px solid rgba(108,99,255,.3)}

/* DASHBOARD */
.dash-wrap{max-width:1100px;margin:0 auto;padding:100px 20px 60px}

/* PRICING */
.price-wrap{max-width:1080px;margin:0 auto;padding:100px 20px 60px}
.plan-card{padding:32px;position:relative;overflow:hidden;transition:var(--tr)}
.plan-pop{position:absolute;top:18px;right:-24px;
  background:linear-gradient(135deg,var(--pr),var(--sc));
  color:#fff;padding:6px 48px;font-size:11px;font-weight:700;
  transform:rotate(45deg);transform-origin:center}
.billing-toggle{display:inline-flex;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;gap:4px}
.billing-btn{padding:9px 22px;border-radius:10px;border:none;cursor:pointer;
  font-size:14px;font-weight:600;transition:var(--tr);background:transparent;color:var(--t2)}
.billing-btn.active{background:var(--pr);color:#fff}

/* LEADERBOARD */
.lb-wrap{max-width:820px;margin:0 auto;padding:100px 20px 60px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:48px}
.podium-item{text-align:center;flex:1;max-width:180px}
.podium-bar{margin-top:8px;border:1px solid var(--br);border-bottom:none;border-radius:8px 8px 0 0}
.lb-row{padding:14px 18px;display:flex;align-items:center;gap:14px;transition:var(--tr)}
.lb-row:hover{border-color:rgba(108,99,255,.25)!important}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-bg.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--br);border-radius:22px;
  padding:36px;max-width:480px;width:92%;animation:bounceIn .4s ease;position:relative}

/* CTA */
.cta-sec{padding:80px 20px;text-align:center;
  background:linear-gradient(135deg,rgba(108,99,255,.1),rgba(255,101,132,.06));
  border-top:1px solid var(--br);border-bottom:1px solid var(--br)}

/* FOOTER */
footer{padding:44px 40px;border-top:1px solid var(--br)}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px}
.footer-link{color:var(--t3);font-size:13px;margin-bottom:8px;cursor:pointer;transition:color .2s}
.footer-link:hover{color:var(--pr)}

/* RESPONSIVE */
@media(max-width:768px){
  .nav{padding:12px 16px}
  .nav-links{display:none}
  .ci-body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  section{padding:60px 16px}
  .stats-row{gap:28px}
}
</style>
</head>
<body>


<!-- =================== NAVBAR =================== -->
<nav class="nav" id="nav">
  <a class="nav-logo" onclick="go('landing')">
    <div class="nav-logo-icon">🎯</div>
    <span>Mock<span class="gt">Interview</span> <span id="nav-pro" style="display:none" class="badge b-pro" style="font-size:10px">PRO</span></span>
  </a>
  <div class="nav-links">
    <button class="nav-link active" id="nl-landing" onclick="go('landing')">🏠 Bosh sahifa</button>
    <button class="nav-link" id="nl-pricing" onclick="go('pricing')">💎 Narxlar</button>
    <button class="nav-link" id="nl-leaderboard" onclick="go('leaderboard')">🏆 Reyting</button>
    <button class="nav-link" id="nl-dashboard" onclick="go('dashboard')" style="display:none">📊 Dashboard</button>
  </div>
  <div class="nav-auth" id="nav-auth">
    <button class="btn btn-sc" style="padding:8px 18px;font-size:13px" onclick="openModal('login')">Kirish</button>
    <button class="btn btn-pr" style="padding:8px 18px;font-size:13px" onclick="openModal('register')">Ro'yxatdan o'tish</button>
  </div>
</nav>

<!-- =================== PAGES =================== -->
<div id="page-landing" class="page active"></div>
<div id="page-setup" class="page"></div>
<div id="page-voice" class="page" style="padding:0"></div>
<div id="page-coding" class="page" style="padding:0;height:100vh"></div>
<div id="page-results" class="page"></div>
<div id="page-dashboard" class="page"></div>
<div id="page-pricing" class="page"></div>
<div id="page-leaderboard" class="page"></div>

<!-- =================== AUTH MODAL =================== -->
<div class="modal-bg" id="modal-auth">
  <div class="modal-box">
    <button onclick="closeModal('auth')" style="position:absolute;top:14px;right:16px;background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer">✕</button>
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:40px;margin-bottom:10px">🎯</div>
      <h2 id="auth-title" style="font-size:22px;font-weight:700;margin-bottom:6px">Xush kelibsiz!</h2>
      <p id="auth-sub" style="color:var(--t2);font-size:14px">Davom etish uchun kiring</p>
    </div>
    <div id="auth-err" style="display:none;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.3);border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:14px"></div>
    <form id="auth-form" onsubmit="submitAuth(event)" style="display:flex;flex-direction:column;gap:12px">
      <input id="auth-name" class="inp" placeholder="Ismingiz" style="display:none"/>
      <input id="auth-email" class="inp" type="email" placeholder="Email" required/>
      <input id="auth-pass" class="inp" type="password" placeholder="Parol" required/>
      <button type="submit" id="auth-btn" class="btn btn-pr" style="justify-content:center;font-size:15px;padding:14px">🚀 Kirish</button>
    </form>
    <div style="text-align:center;margin-top:18px;font-size:14px;color:var(--t2)">
      <span id="auth-switch-text">Hisobingiz yo'qmi? </span>
      <span style="color:var(--pr);cursor:pointer;font-weight:600" onclick="toggleAuthMode()">
        <span id="auth-switch-link">Ro'yxatdan o'ting</span>
      </span>
    </div>
  </div>
</div>

<!-- =================== PAYMENT MODAL =================== -->
<div class="modal-bg" id="modal-pay">
  <div class="modal-box" style="max-width:420px">
    <button onclick="closeModal('pay')" style="position:absolute;top:14px;right:16px;background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer">✕</button>
    <div id="pay-content"></div>
  </div>
</div>

<!-- =================== SUCCESS MODAL =================== -->
<div class="modal-bg" id="modal-success">
  <div class="modal-box bounce-in" style="text-align:center;max-width:360px">
    <div style="font-size:72px;margin-bottom:16px">🎉</div>
    <h3 style="font-size:22px;font-weight:800;color:#43E97B;margin-bottom:8px">To'lov muvaffaqiyatli!</h3>
    <p style="color:var(--t2)">PRO versiya faollashtirildi. Xush kelibsiz!</p>
  </div>
</div>


<script>
// ===================================================
// STATE
// ===================================================
const S = {
  page: 'landing',
  user: null,
  isPro: false,
  authMode: 'login',
  interview: { level:'junior', direction:'fullstack' },
  session: { answers:[], scores:[], voiceScore:0, codingScore:0, total:0, timeSpent:0 },
  billing: 'monthly',
  payStep: 1,
  payMethod: null,
  setupStep: 1,
  selectedLevel: null,
  selectedDir: null,
  vi: { qIndex:0, phase:'intro', transcript:'', feedback:null, timer:0, totalTime:0, scores:[] },
  ci: { chalIndex:0, code:'', output:'', outputType:'idle', scores:[], timer:0 },
  resTab: 'overview',
  dashTab: 'stats',
};

// Load user from localStorage
try { const u = localStorage.getItem('mip_user'); if(u) S.user = JSON.parse(u); } catch(e){}

// ===================================================
// DATA

<script>
// ===================================================
// ROUTER & UTILS
// ===================================================
function go(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(!el) return;
  el.classList.add('active');
  S.page = page;
  window.scrollTo({top:0,behavior:'instant'});

  // nav link active
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  const nl = document.getElementById('nl-'+page);
  if(nl) nl.classList.add('active');

  // hide nav on interview pages
  const nav = document.getElementById('nav');
  if(page==='voice'||page==='coding') nav.style.display='none';
  else nav.style.display='';

  // render page
  const renders = {
    landing: renderLanding,
    setup: renderSetup,
    voice: renderVoice,
    coding: renderCoding,
    results: renderResults,
    dashboard: renderDashboard,
    pricing: renderPricing,
    leaderboard: renderLeaderboard,
  };
  if(renders[page]) renders[page]();
}

function $id(id){ return document.getElementById(id); }
function h(tag,attrs,inner){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{ if(k==='class') el.className=v; else if(k.startsWith('on')) el[k]=v; else el.setAttribute(k,v); });
  if(inner!==undefined) el.innerHTML=inner;
  return el;
}
function fmt2(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function openModal(type){
  if(type==='login'||type==='register'){
    S.authMode=type;
    updateAuthModal();
    $id('modal-auth').classList.add('open');
  }
}
function closeModal(id){ $id('modal-'+id).classList.remove('open'); }

function toggleAuthMode(){
  S.authMode = S.authMode==='login'?'register':'login';
  updateAuthModal();
}
function updateAuthModal(){
  const isLogin=S.authMode==='login';
  $id('auth-title').textContent=isLogin?'Xush kelibsiz!':'Hisob yaratish';
  $id('auth-sub').textContent=isLogin?'Davom etish uchun kiring':'Bepul boshlang';
  $id('auth-name').style.display=isLogin?'none':'block';
  $id('auth-btn').textContent=isLogin?'🚀 Kirish':"✨ Ro'yxatdan o'tish";
  $id('auth-switch-text').textContent=isLogin?"Hisobingiz yo'qmi? ":"Hisobingiz bormi? ";
  $id('auth-switch-link').textContent=isLogin?"Ro'yxatdan o'ting":"Kiring";
  $id('auth-err').style.display='none';
}
function submitAuth(e){
  e.preventDefault();
  const email=$id('auth-email').value.trim();
  const pass=$id('auth-pass').value.trim();
  const name=$id('auth-name').value.trim();
  const err=$id('auth-err');
  if(!email||!pass){ err.textContent="⚠️ Barcha maydonlarni to'ldiring"; err.style.display='block'; return; }
  if(S.authMode==='register'&&!name){ err.textContent="⚠️ Ismingizni kiriting"; err.style.display='block'; return; }
  S.user={ id:Date.now(), name:S.authMode==='login'?email.split('@')[0]:name, email, joinDate:new Date().toLocaleDateString('uz-UZ') };
  localStorage.setItem('mip_user',JSON.stringify(S.user));
  closeModal('auth');
  updateNavUser();
  go(S.page);
}

function logout(){
  S.user=null; S.isPro=false;
  localStorage.removeItem('mip_user');
  updateNavUser();
  go('landing');
}

function updateNavUser(){
  const authDiv=$id('nav-auth');
  const dashLink=$id('nl-dashboard');
  const proBadge=$id('nav-pro');
  if(S.user){
    authDiv.innerHTML=`
      <div onclick="go('dashboard')" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--br);border-radius:10px;padding:6px 14px;cursor:pointer">
        <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--sc));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${S.user.name[0].toUpperCase()}</div>
        <span style="font-size:14px;font-weight:500">${S.user.name}</span>
      </div>
      <button class="btn btn-sc" onclick="logout()" style="padding:8px 14px;font-size:13px" title="Chiqish">🚪</button>`;
    dashLink.style.display='';
    if(S.isPro) proBadge.style.display='';
  } else {
    authDiv.innerHTML=`
      <button class="btn btn-sc" style="padding:8px 18px;font-size:13px" onclick="openModal('login')">Kirish</button>
      <button class="btn btn-pr" style="padding:8px 18px;font-size:13px" onclick="openModal('register')">Ro'yxatdan o'tish</button>`;
    dashLink.style.display='none';
    proBadge.style.display='none';
  }
}

// Navbar scroll
window.addEventListener('scroll',()=>{
  $id('nav').classList.toggle('scrolled',window.scrollY>20);
});
</script>

    <h2 style="font-size:26px;font-weight:800;text-align:center;margin-bottom:8px">Darajangizni tanlang</h2>
    <p style="color:var(--t2);text-align:center;margin-bottom:28px">Sizning tajribangizga mos darajani belgilang</p>

    ${[['junior','🌱','#43E97B','Junior','0–1 yil tajriba',['HTML teglari','CSS asoslari','JS asoslari','React hooks']],
       ['middle','🔥','#4DC3FF','Middle','1–3 yil tajriba',['Async/Await','Redux','Performance','Testing']],

      <div class="card sel-card" id="lv-${id}" onclick="selectLevel('${id}')"
        style="border-color:${S.selectedLevel===id?col:'rgba(255,255,255,.08)'};background:${S.selectedLevel===id?col+'11':''}">
        <div style="display:flex;align-items:center;gap:16px">
          <div style="width:54px;height:54px;border-radius:14px;background:${col}22;display:flex;align-items:center;justify-content:center;font-size:24px">${ic}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
              <span style="font-weight:700;font-size:17px">${lb}</span>
              <span style="font-size:13px;color:var(--t3)">${desc}</span>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              ${topics.map(t=>`<span style="font-size:11px;background:rgba(255,255,255,.05);padding:3px 8px;border-radius:4px;color:var(--t3)">${t}</span>`).join('')}
            </div>
          </div>
          <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${S.selectedLevel===id?col:'var(--br)'};background:${S.selectedLevel===id?col:'transparent'};display:flex;align-items:center;justify-content:center;font-size:12px">${S.selectedLevel===id?'✓':''}</div>
        </div>
      </div>`).join('')}
    </div>
    <div style="margin-top:28px;display:flex;justify-content:flex-end">
      <button class="btn btn-pr" ${!S.selectedLevel?'disabled':''} onclick="S.setupStep=2;renderSetup()" style="padding:13px 40px">Keyingisi →</button>
    </div>`;
  }
  else if(S.setupStep===2){
    c.innerHTML=`
    <h2 style="font-size:26px;font-weight:800;text-align:center;margin-bottom:8px">Yo'nalishni tanlang</h2>
    <p style="color:var(--t2);text-align:center;margin-bottom:28px">Qaysi soha bo'yicha intervyu topshirasiz?</p>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">
      ${[['fullstack','🌐','Full-stack Frontend',"Hamma texnologiyalar bo'yicha"],
         ['react','⚛️','React Specialist','React va ekotizim'],
         ['next','▲','Next.js Developer','Next.js va server components'],
         ['vanilla','⚡','Vanilla JS','HTML, CSS, JavaScript']].map(([id,ic,lb,desc])=>`
        <div class="card sel-card" onclick="selectDir('${id}')"
          style="padding:22px;border-color:${S.selectedDir===id?'var(--pr)':'rgba(255,255,255,.08)'};background:${S.selectedDir===id?'rgba(108,99,255,.1)':''}">
          <div style="font-size:30px;margin-bottom:10px">${ic}</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:4px">${lb}</div>
          <div style="font-size:13px;color:var(--t3)">${desc}</div>
        </div>`).join('')}
    </div>
    <div style="margin-top:28px;display:flex;justify-content:space-between">
      <button class="btn btn-sc" onclick="S.setupStep=1;renderSetup()">← Orqaga</button>
      <button class="btn btn-pr" ${!S.selectedDir?'disabled':''} onclick="S.setupStep=3;renderSetup()" style="padding:13px 40px">Keyingisi →</button>
    </div>`;
  }
  else {
    const dirs={fullstack:'Full-stack Frontend',react:'React Specialist',next:'Next.js Developer',vanilla:'Vanilla JS'};
    c.innerHTML=`
    <div style="text-align:center">
      <div style="font-size:60px;margin-bottom:14px">🎯</div>
      <h2 style="font-size:30px;font-weight:800;margin-bottom:8px">Tayyor!</h2>
      <p style="color:var(--t2);margin-bottom:28px">Intervyu boshlanishga tayyor. Boshlashdan oldin tekshiring.</p>
      <div class="card" style="padding:26px;margin-bottom:28px;display:inline-block;min-width:300px;text-align:left">
        ${[['🎓','Daraja',S.selectedLevel?.charAt(0).toUpperCase()+S.selectedLevel?.slice(1)],
           ['🚀',"Yo'nalish",dirs[S.selectedDir]],
           ['🎤','1-bosqich','Ovozli savollar (6 savol)'],
           ['💻','2-bosqich','Texnik vazifalar (3 masala)'],
           ['🏆','Natija','AI tahlil + 100 ball']].map(([ic,l,v])=>`
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
            <span style="font-size:18px">${ic}</span>
            <span style="color:var(--t2);width:95px;font-size:13px">${l}:</span>
            <span style="font-weight:600;font-size:13px">${v}</span>
          </div>`).join('')}
      </div>
      <div style="background:rgba(255,184,77,.09);border:1px solid rgba(255,184,77,.3);border-radius:12px;padding:13px 18px;margin-bottom:28px;display:inline-block">
        <p style="color:var(--yel);font-size:13px">🎤 Ovozli savollar uchun mikrofon ruxsatini bering. Ovoz bo'lmasa matn yozish ham mumkin.</p>
      </div>
      <div style="display:flex;gap:14px;justify-content:center">
        <button class="btn btn-sc" onclick="S.setupStep=1;S.selectedLevel=null;S.selectedDir=null;renderSetup()">← Qayta sozlash</button>
        <button class="btn btn-pr btn-pulse" onclick="startInterview()" style="font-size:17px;padding:16px 44px;border-radius:14px">🚀 Intervyuni Boshlash</button>
      </div>
    </div>`;
  }
}

function selectLevel(id){
  S.selectedLevel=id;
  renderSetupStep();
}
function selectDir(id){
  S.selectedDir=id;
  renderSetupStep();
}
function startInterview(){
  S.interview.level=S.selectedLevel||'junior';
  S.interview.direction=S.selectedDir||'fullstack';
  S.session={ answers:[], scores:[], voiceScore:0, codingScore:0, total:0, timeSpent:0 };
  S.vi={ qIndex:0, phase:'intro', transcript:'', feedback:null, timer:0, totalTime:0, scores:[] };
  go('voice');
}
</script>


<script>
// ===================================================
// VOICE INTERVIEW PAGE
// ===================================================
let viTimer=null, viSynth=window.speechSynthesis, viRec=null;

function renderVoice(){
  const qs=QS[S.interview.level]||QS.junior;
  const page=$id('page-voice');
  page.innerHTML=`
  <div class="vi-wrap">
    <div class="vi-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">🎤</span>
        <span style="font-weight:700">Bosqich 1: Ovozli Intervyu</span>
        <span class="badge b-gr" id="vi-level">${S.interview.level}</span>
      </div>
      <div style="display:flex;align-items:center;gap:18px">
        <div id="vi-clock" style="font-family:monospace;color:var(--pr);font-size:17px;font-weight:700">00:00</div>
        <div id="vi-qcnt" style="color:var(--t2);font-size:13px">1 / ${qs.length}</div>
        <button class="btn btn-rd" style="padding:7px 14px;font-size:12px" onclick="exitVoice()">Chiqish</button>
      </div>
    </div>
    <div class="vi-progbar"><div class="vi-progress" id="vi-prog" style="width:${(1/qs.length)*100}%"></div></div>
    <div class="vi-body" id="vi-body"></div>
  </div>`;

  clearInterval(viTimer);
  S.vi.totalTime=0;
  viTimer=setInterval(()=>{ S.vi.totalTime++; const c=$id('vi-clock'); if(c) c.textContent=fmt2(S.vi.totalTime); },1000);
  renderVoiceBody();
  setTimeout(()=>greetAndAsk(0),600);
}

function renderVoiceBody(){
  const qs=QS[S.interview.level]||QS.junior;
  const q=qs[S.vi.qIndex];
  const body=$id('vi-body');
  if(!body) return;

  const phaseText={speaking:'🔊 Gapirmoqda...',listening:'👂 Javobingizni gapiring...',evaluating:'⚡ Baholamoqda...',manual:'✍️ Matn yozing',intro:'⏳ Tayyorlanmoqda...'};

  body.innerHTML=`
  <div style="text-align:center;margin-bottom:32px">
    <div style="position:relative;display:inline-block">
      <div class="ai-avatar ${S.vi.phase==='speaking'?'speaking':''}" id="ai-av">🤖</div>
      ${S.vi.phase==='speaking'?'<div class="ripple-ring"></div>':''}
    </div>
    <div style="margin-top:14px;font-size:14px;color:var(--t2)">${phaseText[S.vi.phase]||'...'}</div>
    ${S.vi.phase==='speaking'||S.vi.phase==='listening'?`
    <div class="voice-bars" style="justify-content:center;margin-top:10px">
      ${Array.from({length:9},(_,i)=>`<div class="vbar" style="height:${8+i*3}px;animation-delay:${i*0.07}s;background:${S.vi.phase==='speaking'?'var(--pr)':'#43E97B'}"></div>`).join('')}
    </div>`:''}
  </div>

  ${q?`<div class="card q-card">
    <div style="font-size:11px;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Savol ${S.vi.qIndex+1}/${qs.length}</div>
    <h2>${q.q}</h2>
  </div>`:''}

  <div class="card ans-card">
    <div style="font-size:13px;color:${S.vi.phase==='listening'?'#43E97B':'var(--t3)'};margin-bottom:10px">
      ${S.vi.phase==='listening'?'🔴 Yozilmoqda...':'📝 Javobingiz:'}
    </div>
    ${S.vi.phase==='manual'?
      `<textarea class="inp" id="vi-text" rows="4" placeholder="Javobingizni bu yerga yozing...">${S.vi.transcript}</textarea>`
      :`<div id="vi-transcript" style="min-height:72px;font-size:16px;line-height:1.7;color:${S.vi.transcript?'#fff':'var(--t3)'}">
        ${S.vi.transcript||(S.vi.phase==='listening'?'Gapiring yoki quyida tugmani bosing...':'...')}
      </div>`
    }
  </div>

  ${S.vi.feedback?`
  <div class="fb-card" style="border:1px solid ${S.vi.feedback.ok?'rgba(67,233,123,.4)':'rgba(255,77,106,.4)'};background:${S.vi.feedback.ok?'rgba(67,233,123,.05)':'rgba(255,77,106,.05)'}">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:22px">${S.vi.feedback.ok?'✅':'❌'}</span>
      <span style="font-weight:700;font-size:17px;color:${S.vi.feedback.ok?'#43E97B':'var(--red)'}">${S.vi.feedback.ok?"To'g'ri!":'Noto\'g\'ri'} — ${S.vi.feedback.score} ball</span>
    </div>
    <p style="color:var(--t2);font-size:14px">${S.vi.feedback.comment}</p>
    ${!S.vi.feedback.ok?`<p style="font-size:13px;color:var(--t3);margin-top:6px">💡 To'g'ri javob: <span style="color:#fff">${q.a}</span></p>`:''}
  </div>`:''}

  <div style="display:flex;gap:12px;justify-content:center;margin-top:8px">
    ${S.vi.phase==='listening'?`
      <button class="btn btn-gr" onclick="submitVoiceAnswer()" style="padding:13px 32px;font-size:15px">✋ Javob berish</button>
      <button class="btn btn-sc" onclick="skipQuestion()" style="padding:13px 22px">⏭ O'tkazish</button>`:''}
    ${S.vi.phase==='manual'?`
      <button class="btn btn-pr" onclick="submitManual()" style="padding:13px 30px">📤 Yuborish</button>`:''}
  </div>

  ${S.vi.scores.length>0?`
  <div class="score-dots" style="margin-top:24px">
    ${S.vi.scores.map(s=>`<div class="score-dot" style="background:${s>=70?'rgba(67,233,123,.15)':'rgba(255,77,106,.15)'};border-color:${s>=70?'#43E97B':'var(--red)'};color:${s>=70?'#43E97B':'var(--red)'}">${s}</div>`).join('')}
  </div>`:''}`;
}

function speak(text, onEnd){
  if(viSynth) { viSynth.cancel(); }
  const u=new SpeechSynthesisUtterance(text);
  u.lang='uz-UZ'; u.rate=0.88; u.pitch=1.05;
  const voices=viSynth.getVoices();
  const v=voices.find(v=>v.lang.includes('uz'))||voices.find(v=>v.lang.includes('ru'))||voices[0];
  if(v) u.voice=v;
  u.onend=()=>{ S.vi.phase=S.vi.phase==='speaking'?'listening':S.vi.phase; if(onEnd) onEnd(); };
  u.onerror=()=>{ if(onEnd) onEnd(); };
  S.vi.phase='speaking'; renderVoiceBody();
  viSynth.speak(u);
}

function greetAndAsk(idx){
  const qs=QS[S.interview.level]||QS.junior;
  if(idx>=qs.length){ finishVoice(); return; }
  const greeting=idx===0?`Assalomu alaykum! Men sizning AI intervyu assistentingizman. Bugun ${S.interview.level} darajasida frontend bo'yicha savol-javob o'tkazamiz.`:'';
  const qText=`${idx===0?'Birinchi s':'S'}avol: ${qs[idx].q}`;
  speak(greeting?`${greeting} ${qText}`:qText, ()=>{
    S.vi.phase='listening'; renderVoiceBody(); startSTT();
  });
  const prog=$id('vi-prog');
  const qcnt=$id('vi-qcnt');
  if(prog) prog.style.width=`${((idx+1)/qs.length)*100}%`;
  if(qcnt) qcnt.textContent=`${idx+1} / ${qs.length}`;
}

function startSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ S.vi.phase='manual'; S.vi.transcript=''; renderVoiceBody(); return; }
  viRec=new SR(); viRec.lang='uz-UZ'; viRec.continuous=false; viRec.interimResults=true;
  viRec.onresult=e=>{ S.vi.transcript=Array.from(e.results).map(r=>r[0].transcript).join(''); updateTranscript(); };
  viRec.onend=()=>{};
  viRec.onerror=()=>{ S.vi.phase='manual'; renderVoiceBody(); };
  viRec.start();
  setTimeout(()=>{ if(viRec){viRec.stop(); setTimeout(()=>evalVoiceAnswer(S.vi.transcript),400);} },15000);
}

function updateTranscript(){
  const el=$id('vi-transcript'); if(el){ el.textContent=S.vi.transcript; el.style.color='#fff'; }
}

function submitVoiceAnswer(){ if(viRec){ viRec.stop(); } setTimeout(()=>evalVoiceAnswer(S.vi.transcript),300); }
function skipQuestion(){ if(viRec){ viRec.stop(); } evalVoiceAnswer(''); }
function submitManual(){ const t=$id('vi-text'); evalVoiceAnswer(t?t.value:''); }

function evalVoiceAnswer(ans){
  const qs=QS[S.interview.level]||QS.junior;
  const q=qs[S.vi.qIndex];
  const kws=q.a.toLowerCase().split(/\s+/).filter(w=>w.length>3);
  const al=(ans||'').toLowerCase();
  const hits=kws.filter(kw=>al.includes(kw)).length;
  const sc=Math.min(100,Math.round((hits/Math.max(kws.length,1))*100+Math.random()*10));
  const ok=sc>=48;
  const comments_ok=["Ajoyib! To'g'ri javob.","Zo'r! Tushuncha to'g'ri.","Barakalla! Yaxshi bilasiz."];
  const comments_no=["Noto'g'ri. Yana o'rganing.","Yaxshi urinish, lekin to'liq emas.","Ko'proq o'rganish kerak."];
  S.vi.feedback={ok,score:sc,comment:(ok?comments_ok:comments_no)[Math.floor(Math.random()*3)]};
  S.vi.scores.push(sc);
  S.session.answers.push({question:q.q,userAnswer:ans||'(berilmadi)',correctAnswer:q.a,score:sc,ok});
  renderVoiceBody();
  const fbText=ok?`To'g'ri! ${S.vi.feedback.comment} Ball: ${sc}`:`Afsuski, to'liq emas. To'g'ri javob: ${q.a.slice(0,70)}`;
  speak(fbText, ()=>{
    if(S.vi.qIndex+1<qs.length){
      setTimeout(()=>{ S.vi.feedback=null; S.vi.transcript=''; S.vi.qIndex++; greetAndAsk(S.vi.qIndex); },1000);
    } else { setTimeout(finishVoice,800); }
  });
}

function finishVoice(){
  const avg=S.vi.scores.length>0?Math.round(S.vi.scores.reduce((a,b)=>a+b,0)/S.vi.scores.length):60;
  S.session.voiceScore=avg;
  S.session.timeSpent=S.vi.totalTime;
  clearInterval(viTimer);
  speak("Ovozli qism yakunlandi! Endi texnik vazifalar qismiga o'tamiz. Tayyor bo'ling!", ()=>{
    S.ci={ chalIndex:0, code:CHALLENGES[S.interview.level][0].code, output:'', outputType:'idle', scores:[], timer:0 };
    go('coding');
  });
}

function exitVoice(){ clearInterval(viTimer); if(viRec) viRec.stop(); if(viSynth) viSynth.cancel(); go('setup'); }
</script>


<script>
// ===================================================
// CODING INTERVIEW PAGE
// ===================================================
let ciTimer=null;

function renderCoding(){
  const chals=CHALLENGES[S.interview.level]||CHALLENGES.junior;
  const c=S.ci;
  const ch=chals[c.chalIndex];
  const page=$id('page-coding');

  page.innerHTML=`
  <div class="ci-wrap">
    <div class="ci-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">💻</span>
        <span style="font-weight:700">Bosqich 2: Texnik Intervyu</span>
        <span class="badge ${S.interview.level==='junior'?'b-gr':S.interview.level==='middle'?'b-bl':'b-yl'}">${S.interview.level}</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span id="ci-clock" style="font-family:monospace;font-size:17px;font-weight:700;color:var(--pr)">00:00</span>
        <div class="ci-num">
          ${chals.map((_,i)=>`<div class="ci-num-btn ${c.scores[i]?'solved':i===c.chalIndex?'active':''}" onclick="switchChallenge(${i})">${c.scores[i]?'✓':i+1}</div>`).join('')}
        </div>
        <button class="btn btn-rd" style="padding:7px 14px;font-size:12px" onclick="exitCoding()">Chiqish</button>
      </div>
    </div>
    <div class="ci-body">
      <div class="ci-left">
        <div style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
            <span style="font-weight:800;font-size:19px">${ch.title}</span>
            <span style="padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;
              background:${ch.diff==='Oson'?'rgba(67,233,123,.15)':ch.diff==="O'rta"?'rgba(255,184,77,.15)':'rgba(255,77,106,.15)'};
              color:${ch.diff==='Oson'?'#43E97B':ch.diff==="O'rta"?'#FFB84D':'#FF4D6A'}">${ch.diff}</span>
            ${c.scores[c.chalIndex]!==undefined?`<span style="padding:4px 10px;border-radius:20px;font-size:12px;background:rgba(67,233,123,.15);color:#43E97B">✓ ${c.scores[c.chalIndex]} ball</span>`:''}
          </div>
          <div style="background:rgba(255,255,255,.03);border:1px solid var(--br);border-radius:12px;padding:18px;color:var(--t2);font-size:14px;line-height:1.8;white-space:pre-wrap">${ch.desc}</div>
        </div>

        <div style="margin-bottom:16px">
          <button id="hint-btn" onclick="toggleHint()" style="background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);color:var(--yel);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px">💡 Maslahat ko'rish</button>
          <div id="hint-box" style="display:none;margin-top:10px;padding:12px;background:rgba(255,184,77,.07);border-radius:10px;border:1px solid rgba(255,184,77,.2);color:var(--yel);font-size:13px">💡 ${ch.hint}</div>
        </div>

        <div style="border-radius:12px;overflow:hidden;border:1px solid var(--br)">
          <div style="padding:10px 14px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:8px;font-size:13px">
            <span style="color:${c.outputType==='success'?'#43E97B':c.outputType==='error'?'var(--red)':c.outputType==='running'?'var(--yel)':'var(--t3)'}">
              ${{success:'✅',error:'❌',running:'⚡',idle:'▶'}[c.outputType]||'▶'} Natija
            </span>
          </div>
          <div class="output-box" id="ci-output" style="color:${c.outputType==='error'?'var(--red)':c.outputType==='success'?'#43E97B':'var(--t2)'}">
            ${c.output||'Kodni ishga tushiring...'}
          </div>
        </div>
      </div>

      <div class="ci-right">
        <div style="padding:9px 14px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;background:#0C0D1A">
          <div class="dot-row">
            <div class="mac-dot" style="background:#FF5F57"></div>
            <div class="mac-dot" style="background:#FEBC2E"></div>
            <div class="mac-dot" style="background:#28C840"></div>
          </div>
          <span style="font-size:12px;color:var(--t3);font-family:monospace">solution.js</span>
          <button onclick="resetCode()" style="background:none;border:none;color:var(--t3);font-size:12px;cursor:pointer">🔄 Reset</button>
        </div>
        <textarea class="code-area" id="ci-code" onkeydown="handleTab(event)" spellcheck="false">${c.code||ch.code}</textarea>
        <div class="ci-run-bar">
          <button class="btn btn-gr" onclick="runCode()" style="flex:1;justify-content:center;padding:12px;font-size:15px">▶ Ishga Tushurish</button>
          <button class="btn btn-pr" onclick="nextChallenge()" style="padding:12px 18px">
            ${c.chalIndex+1<chals.length?'Keyingisi →':'🏁 Yakunlash'}
          </button>
        </div>
      </div>
    </div>
  </div>`;

  clearInterval(ciTimer);
  S.ci.timer=0;
  ciTimer=setInterval(()=>{ S.ci.timer++; const cl=$id('ci-clock'); if(cl){ cl.textContent=fmt2(S.ci.timer); if(S.ci.timer>300) cl.style.color='var(--red)'; } },1000);

  const syn=window.speechSynthesis;
  if(syn){ syn.cancel(); const u=new SpeechSynthesisUtterance("Ikkinchi bosqich: texnik intervyu. Berilgan masalalarni hal qiling!"); u.lang='uz-UZ'; u.rate=0.9; setTimeout(()=>syn.speak(u),500); }
}

function toggleHint(){
  const box=$id('hint-box'); const btn=$id('hint-btn');
  if(!box) return;
  const show=box.style.display==='none';
  box.style.display=show?'block':'none';
  btn.textContent=show?'🔼 Maslahatni yashirish':"💡 Maslahat ko'rish";
}

function handleTab(e){
  if(e.key==='Tab'){
    e.preventDefault();
    const ta=e.target, s=ta.selectionStart;
    ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s);
    ta.selectionStart=ta.selectionEnd=s+2;
    S.ci.code=ta.value;
  }
}

function runCode(){
  const ta=$id('ci-code'); if(!ta) return;
  const code=ta.value; S.ci.code=code;
  S.ci.outputType='running'; S.ci.output='⚡ Ishga tushirilmoqda...';
  const out=$id('ci-output'); if(out){ out.textContent=S.ci.output; out.style.color='var(--yel)'; }

  setTimeout(()=>{
    try{
      const logs=[];
      const mc={log:(...a)=>logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))};
      new Function('console',code)(mc);
      const result=logs.join('\n');
      S.ci.output=result||'(chiqish yo\'q)';
      S.ci.outputType='success';
      const chals=CHALLENGES[S.interview.level]||CHALLENGES.junior;
      const ch=chals[S.ci.chalIndex];
      if(ch.check&&ch.check(result)){
        const sc=Math.max(60,100-Math.floor(S.ci.timer/8));
        S.ci.scores[S.ci.chalIndex]=sc;
        const syn=window.speechSynthesis;
        if(syn){ const u=new SpeechSynthesisUtterance(`Barakalla! Masala to'g'ri yechildi. ${sc} ball!`); u.lang='uz-UZ'; u.rate=0.9; syn.speak(u); }
      }
    }catch(err){
      S.ci.output=`❌ Xato: ${err.message}`;
      S.ci.outputType='error';
    }
    renderCoding();
  },500);
}

function resetCode(){
  const chals=CHALLENGES[S.interview.level]||CHALLENGES.junior;
  S.ci.code=chals[S.ci.chalIndex].code;
  S.ci.output=''; S.ci.outputType='idle';
  renderCoding();
}

function switchChallenge(i){
  const ta=$id('ci-code'); if(ta) S.ci.code=ta.value;
  const chals=CHALLENGES[S.interview.level]||CHALLENGES.junior;
  S.ci.chalIndex=i; S.ci.code=chals[i].code; S.ci.output=''; S.ci.outputType='idle';
  renderCoding();
}

function nextChallenge(){
  const ta=$id('ci-code'); if(ta) S.ci.code=ta.value;
  const chals=CHALLENGES[S.interview.level]||CHALLENGES.junior;
  if(S.ci.chalIndex+1<chals.length){
    S.ci.chalIndex++; S.ci.code=chals[S.ci.chalIndex].code; S.ci.output=''; S.ci.outputType='idle';
    renderCoding();
  } else {
    clearInterval(ciTimer);
    const avgC=S.ci.scores.length>0?Math.round(S.ci.scores.filter(Boolean).reduce((a,b)=>a+b,0)/chals.length):55;
    S.session.codingScore=avgC;
    S.session.total=Math.round(S.session.voiceScore*0.4+avgC*0.6);
    const syn=window.speechSynthesis;
    if(syn){ syn.cancel(); const u=new SpeechSynthesisUtterance(`Intervyu tugadi! Umumiy ballingiz ${S.session.total} ball. Natijalar sahifasiga o'tamiz.`); u.lang='uz-UZ'; u.rate=0.9; syn.speak(u); }
    setTimeout(()=>go('results'),1800);
  }
}

function exitCoding(){ clearInterval(ciTimer); const syn=window.speechSynthesis; if(syn) syn.cancel(); go('setup'); }
</script>

    {rank:9,name:'Ravshan N.',score:76,level:'Middle',badge:'',av:'R',cnt:12},
    {rank:10,name:"Muhammadali B.",score:74,level:'Junior',badge:'',av:'M',cnt:35},
  ];
  const page=$id('page-leaderboard');
  page.innerHTML=`<div class="lb-wrap">
  <div style="text-align:center;margin-bottom:44px">
    <h1 style="font-size:clamp(26px,5vw,46px);font-weight:900;margin-bottom:10px">🏆 <span class="gt">Reyting Jadvali</span></h1>
    <p style="color:var(--t2)">Eng yaxshi natijalar ko'rsatgan dasturchlar</p>
  </div>

  <div class="podium">
    ${[leaders[1],leaders[0],leaders[2]].map((l,i)=>`
      <div class="podium-item">
        <div style="font-size:38px;margin-bottom:7px">${l.badge||'🏅'}</div>
        <div style="width:60px;height:60px;border-radius:50%;margin:0 auto 7px;
          background:${i===1?'linear-gradient(135deg,#FFD700,#FFA500)':i===0?'linear-gradient(135deg,#C0C0C0,#A9A9A9)':'linear-gradient(135deg,#CD7F32,#A0522D)'};
          display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#0A0B14">${l.av}</div>
        <div style="font-weight:700;font-size:13px;margin-bottom:3px">${l.name}</div>
        <div style="font-size:17px;font-weight:900;color:${i===1?'#FFD700':i===0?'#C0C0C0':'#CD7F32'}">${l.score}</div>
        <div class="podium-bar" style="height:${i===1?110:i===0?75:55}px;background:${i===1?'rgba(255,215,0,.12)':'rgba(255,255,255,.03)'};border-color:${i===1?'rgba(255,215,0,.28)':'var(--br)'}"></div>
      </div>`).join('')}
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    ${leaders.map((l,i)=>`
      <div class="card lb-row" style="border-color:${i<3?`rgba(255,215,0,${.28-i*.07})`:'var(--br)'}">
        <div style="width:34px;text-align:center;font-weight:800;font-size:15px;color:${i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'var(--t3)'}">${i<3?['🥇','🥈','🥉'][i]:'#'+l.rank}</div>
        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--sc));display:flex;align-items:center;justify-content:center;font-weight:700">${l.av}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${l.name}</div>
          <div style="font-size:12px;color:var(--t3)">${l.cnt} ta intervyu</div>
        </div>
        <span class="badge ${l.level==='Senior'?'b-yl':l.level==='Middle'?'b-bl':'b-gr'}">${l.level}</span>
        <div style="font-size:20px;font-weight:900;color:${l.score>=90?'#43E97B':l.score>=80?'#4DC3FF':'var(--t1)'};min-width:44px;text-align:right">${l.score}</div>
      </div>`).join('')}
  </div>
  </div>`;
}
</script>


<script>
// ===================================================
// PRICING PAGE
// ===================================================
function renderPricing(){
  const page=$id('page-pricing');
  const m=S.billing==='monthly';
  const plans=[
    {name:'Bepul',price:0,per:'',feats:['3 ta intervyu/oy','5 ta savol/sessiya','Basic baholash','Top 3 masala'],cta:'Boshlash',col:'var(--t2)',ic:'🆓',pop:false},
    {name:'PRO',price:m?49000:399000,per:m?'/oy':'/yil',feats:['Cheksiz intervyu','Barcha savollar (500+)','AI tahlil + tavsiyalar','Barcha masalalar','Progress kuzatish','Sertifikat','Priority support','Mock HR intervyu'],cta:'PRO Sotib Olish',col:'var(--pr)',ic:'💎',pop:true},
    {name:'Team',price:m?199000:1590000,per:m?'/oy':'/yil',feats:['10 foydalanuvchi','Barcha PRO imkoniyatlar','Team dashboard','Guruh tahlili','Custom savollar','Onboarding yordam'],cta:"Bog'lanish",col:'#FFB84D',ic:'👥',pop:false},
  ];
  page.innerHTML=`<div class="price-wrap">
  <div style="text-align:center;margin-bottom:44px">
    <h1 style="font-size:clamp(26px,5vw,48px);font-weight:900;margin-bottom:12px">Oddiy va <span class="gt">Shaffof Narxlar</span></h1>
    <p style="color:var(--t2);font-size:17px;margin-bottom:28px">O'z darajangizga mos plan tanlang</p>
    <div class="billing-toggle">
      <button class="billing-btn ${m?'active':''}" onclick="S.billing='monthly';renderPricing()">Oylik</button>
      <button class="billing-btn ${!m?'active':''}" onclick="S.billing='yearly';renderPricing()">
        Yillik <span style="margin-left:6px;font-size:11px;background:rgba(67,233,123,.2);color:#43E97B;padding:2px 6px;border-radius:4px">-32%</span>
      </button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-bottom:56px">
    ${plans.map(p=>`
      <div class="card plan-card" style="border-color:${p.pop?'rgba(108,99,255,.5)':'rgba(255,255,255,.08)'};transform:${p.pop?'scale(1.02)':'scale(1)'};box-shadow:${p.pop?'0 20px 60px rgba(108,99,255,.18)':''}">
        ${p.pop?`<div class="plan-pop">POPULAR</div>`:''}
        <div style="font-size:34px;margin-bottom:10px">${p.ic}</div>
        <h3 style="font-size:21px;font-weight:800;margin-bottom:8px">${p.name}</h3>
        <div style="margin-bottom:22px">
          <span style="font-size:38px;font-weight:900;color:${p.col}">${p.price===0?'Bepul':p.price.toLocaleString('uz-UZ')}</span>
          ${p.price>0?`<span style="color:var(--t3);font-size:14px"> so'm${p.per}</span>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:26px">
          ${p.feats.map(f=>`<div style="display:flex;gap:8px;font-size:14px;color:var(--t2)"><span style="color:#43E97B;flex-shrink:0">✓</span>${f}</div>`).join('')}
        </div>
        <button class="btn ${p.pop?'btn-pr':'btn-sc'}" style="width:100%;justify-content:center;padding:14px;font-size:15px" onclick="handleBuy('${p.name}')">
          ${S.isPro&&p.name==='PRO'?'✅ Faol':p.cta}
        </button>
      </div>`).join('')}
  </div>

  <div style="max-width:700px;margin:0 auto">
    <h2 style="text-align:center;font-size:26px;font-weight:800;margin-bottom:28px">Ko'p so'raladigan savollar</h2>
    ${[["Bepul versiyada nima bor?","Oyiga 3 ta intervyu, 5 ta savol va asosiy baholash kiradi."],
       ["To'lovni bekor qilsam bo'ladimi?","Ha, istalgan vaqt hech qanday jarimosiz bekor qilish mumkin."],
       ["Sertifikat berasilarsizmi?","PRO obunachilarga har yakunlangan intervyu uchun PDF sertifikat beriladi."],
       ["Qanday to'lov usullari qo'llab-quvvatlanadi?","Payme va Click orqali o'zbek bank kartalariga to'lash mumkin."]].map(([q,a])=>`
      <div class="card" style="padding:18px;margin-bottom:10px;cursor:pointer">
        <div style="font-weight:600;margin-bottom:5px">❓ ${q}</div>
        <div style="font-size:14px;color:var(--t2)">${a}</div>
      </div>`).join('')}
  </div>
  </div>`;
}

function handleBuy(name){
  if(name==='Bepul'){ go('setup'); return; }
  if(name==='Team'){ alert("Bog'lanish uchun: info@mockinterview.uz"); return; }
  if(!S.user){ openModal('register'); return; }
  showPayModal();
}

function showPayModal(){
  S.payStep=1; S.payMethod=null;
  renderPayContent();
  $id('modal-pay').classList.add('open');
}

function renderPayContent(){
  const c=$id('pay-content'); if(!c) return;
  const amt=S.billing==='monthly'?'49,000':'399,000';
  if(!S.payMethod){
    c.innerHTML=`
    <h3 style="font-size:19px;font-weight:700;margin-bottom:18px;text-align:center">To'lov usulini tanlang</h3>
    <div style="display:flex;flex-direction:column;gap:11px">
      <button onclick="S.payMethod='payme';renderPayContent()" style="background:linear-gradient(135deg,#00AABB,#00CCDD);border:none;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:14px;cursor:pointer">
        <div style="width:42px;height:42px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#00AABB">P</div>
        <div style="text-align:left"><div style="color:#fff;font-weight:700;font-size:15px">Payme</div><div style="color:rgba(255,255,255,.8);font-size:12px">Karta orqali to'lash</div></div>
      </button>
      <button onclick="S.payMethod='click';renderPayContent()" style="background:linear-gradient(135deg,#2196F3,#1565C0);border:none;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:14px;cursor:pointer">
        <div style="width:42px;height:42px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#2196F3">C</div>
        <div style="text-align:left"><div style="color:#fff;font-weight:700;font-size:15px">Click</div><div style="color:rgba(255,255,255,.8);font-size:12px">Click ilova orqali</div></div>
      </button>
    </div>
    <button onclick="closeModal('pay')" style="margin-top:13px;width:100%;background:transparent;border:1px solid var(--br);color:var(--t3);padding:11px;border-radius:10px;cursor:pointer">Bekor qilish</button>`;
  } else if(S.payStep===1){
    c.innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:7px">${S.payMethod==='payme'?'💳':'📱'}</div>
      <h3 style="font-size:18px;font-weight:700">${S.payMethod==='payme'?'Payme':'Click'} orqali to'lash</h3>
      <p style="color:#43E97B;font-size:16px;font-weight:700;margin-top:6px">${amt} so'm</p>
    </div>
    <label style="display:block;margin-bottom:7px;font-size:13px;color:var(--t2)">${S.payMethod==='payme'?'Karta raqami':'Telefon raqam'}</label>
    <input id="pay-inp" class="inp" type="${S.payMethod==='payme'?'text':'tel'}" placeholder="${S.payMethod==='payme'?'0000 0000 0000 0000':'+998 XX XXX XX XX'}" style="margin-bottom:13px">
    ${S.payMethod==='payme'?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><input class="inp" placeholder="MM/YY"><input class="inp" type="password" placeholder="CVV"></div>`:''}
    <button onclick="S.payStep=2;renderPayContent()" class="btn btn-pr" style="width:100%;justify-content:center">Tasdiqlash kodini yuborish →</button>`;
  } else {
    c.innerHTML=`
    <div style="text-align:center">
      <p style="color:var(--t2);font-size:14px;margin-bottom:18px">SMS yuborildi. 6 xonali kodni kiriting:</p>
      <div style="display:flex;gap:7px;justify-content:center;margin-bottom:18px">
        ${[...Array(6)].map(()=>`<input style="width:42px;height:50px;text-align:center;font-size:20px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--br);border-radius:9px;color:#fff;outline:none" maxlength="1">`).join('')}
      </div>
      <button onclick="confirmPayment()" class="btn btn-gr" style="width:100%;justify-content:center;padding:13px;font-size:15px">✅ To'lovni Tasdiqlash</button>
      <button onclick="S.payStep=1;renderPayContent()" style="margin-top:10px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px">← Orqaga</button>
    </div>`;
  }
}

function confirmPayment(){
  closeModal('pay');
  S.isPro=true;
  $id('nav-pro').style.display='';
  $id('modal-success').classList.add('open');
  setTimeout(()=>{ $id('modal-success').classList.remove('open'); },2800);
}

// ===================================================
// INIT
// ===================================================
updateNavUser();
renderLanding();
</script>
</body>
</html>
