const AppContext = createContext(null);

  const [page, setPage] = useState('landing');

      user, setUser,
      authModal, setAuthModal,
      isPro, setIsPro,
      logout

// Circular Progress
const CircularProgress = ({ value, size=120, stroke=10, color='#6C63FF', label='' }) => {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return (
    <div style={{ position:'relative', width:size, height:size, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <svg width={size} height={size} style={{ position:'absolute', transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
          strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={offset}
          strokeLinecap="round" style={{ transition:'stroke-dashoffset 1s ease' }} />
      </svg>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize: size/5, fontWeight:800, color }}>{value}</div>
        {label && <div style={{ fontSize:10, color:'var(--text-muted)' }}>{label}</div>}
      </div>
    </div>
  );
};

// Auth Modal
const AuthModal = () => {
  const { authModal, setAuthModal, setUser, navigate } = useApp();
  const [form, setForm] = useState({ name:'', email:'', password:'' });
  const [error, setError] = useState('');

  if (!authModal) return null;

  const isLogin = authModal === 'login';

  const submit = (e) => {
    e.preventDefault();
    if (!form.email || !form.password) { setError('Barcha maydonlarni to\'ldiring'); return; }
    if (!isLogin && !form.name) { setError('Ismingizni kiriting'); return; }

    const userData = {
      id: Date.now(),
      name: isLogin ? (form.email.split('@')[0]) : form.name,
      email: form.email,
      joinDate: new Date().toLocaleDateString('uz-UZ'),
      interviewCount: 0, bestScore: 0, level: 'Junior'
    };
    localStorage.setItem('mip_user', JSON.stringify(userData));
    setUser(userData);
    setAuthModal(null);
    setError('');
  };

  return (
    <div className="modal-overlay" onClick={() => setAuthModal(null)}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <div style={{ textAlign:'center', marginBottom:32 }}>

          <p style={{ color:'var(--text-secondary)', fontSize:14 }}>
            {isLogin ? 'Davom etish uchun kiring' : 'Bepul boshlang, har doim'}
          </p>

          <div style={{ background:'rgba(255,77,106,0.1)', border:'1px solid rgba(255,77,106,0.3)',

        )}

              onChange={e => setForm({...form, name:e.target.value})} />

          </button>

        <div style={{ textAlign:'center', marginTop:20, color:'var(--text-secondary)', fontSize:14 }}>
          {isLogin ? "Hisobingiz yo'qmi? " : "Hisobingiz bormi? "}

            style={{ color:'var(--primary)', cursor:'pointer', fontWeight:600 }}>

        </div>

        <button onClick={() => setAuthModal(null)} style={{

          background:'transparent', border:'none', color:'var(--text-muted)',

const VoiceInterviewPage = () => {
  const { navigate, interviewConfig, setInterviewState } = useApp();
  const [phase, setPhase] = useState('intro'); // intro | speaking | listening | evaluating | done
  const [qIndex, setQIndex] = useState(0);
  const [transcript, setTranscript] = useState('');
  const [answers, setAnswers] = useState([]);
  const [scores, setScores] = useState([]);
  const [aiSpeaking, setAiSpeaking] = useState(false);
  const [userSpeaking, setUserSpeaking] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [timer, setTimer] = useState(0);
  const [totalTime, setTotalTime] = useState(0);
  const recognitionRef = useRef(null);
  const synthRef = useRef(window.speechSynthesis);
  const timerRef = useRef(null);

  const level = interviewConfig?.level || 'junior';
  const allQuestions = Object.values(INTERVIEW_DATA[level] || INTERVIEW_DATA.junior).flat();
  const questions = allQuestions.slice(0, 6);

  useEffect(() => {
    setTimeout(() => greetAndAsk(0), 800);
    timerRef.current = setInterval(() => setTotalTime(t => t+1), 1000);
    return () => {
      clearInterval(timerRef.current);
      synthRef.current?.cancel();
      recognitionRef.current?.stop();
    };
  }, []);

  const speak = (text, onEnd) => {
    synthRef.current?.cancel();
    setAiSpeaking(true);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'uz-UZ';
    const voices = synthRef.current.getVoices();
    const uzVoice = voices.find(v => v.lang.includes('uz')) || voices.find(v => v.lang.includes('ru')) || voices[0];
    if (uzVoice) utterance.voice = uzVoice;
    utterance.rate = 0.9; utterance.pitch = 1.1; utterance.volume = 1;
    utterance.onend = () => { setAiSpeaking(false); onEnd && onEnd(); };
    utterance.onerror = () => { setAiSpeaking(false); onEnd && onEnd(); };
    synthRef.current?.speak(utterance);
  };

  const greetAndAsk = (idx) => {
    setPhase('speaking');
    const greeting = idx === 0
      ? `Assalomu alaykum! Men sizning AI intervyu assistentingizman. Bugun ${level} darajasida frontend bo'yicha savol-javob o'tkazamiz. Tayyor bo'lsangiz, birinchi savolni boshlaymiz.`
      : null;
    const questionText = questions[idx]?.q;
    const fullText = greeting ? `${greeting} Savol: ${questionText}` : `${idx+1}-savol: ${questionText}`;

    speak(fullText, () => {
      setPhase('listening');
      startListening();
    });
  };

  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setTranscript('(Mikrofon ishlamayapti - matn yozing)');
      setPhase('manual');
      return;
    }
    const rec = new SR();
    rec.lang = 'uz-UZ';
    rec.continuous = false;
    rec.interimResults = true;
    rec.onstart = () => { setUserSpeaking(true); setTranscript(''); setTimer(0); };
    rec.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join('');
      setTranscript(t);
    };
    rec.onend = () => { setUserSpeaking(false); };
    rec.onerror = () => { setUserSpeaking(false); };
    recognitionRef.current = rec;
    rec.start();
    setTimeout(() => {
      rec.stop();
      setTimeout(() => evaluateAnswer(transcript || ''), 500);
    }, 15000);
  };

  const submitAnswer = () => {
    recognitionRef.current?.stop();
    setTimeout(() => evaluateAnswer(transcript), 300);
  };

  const evaluateAnswer = (ans) => {
    setPhase('evaluating');
    const q = questions[qIndex];
    const correctKeywords = q.a.toLowerCase().split(' ').filter(w => w.length > 3);
    const ansLower = (ans || '').toLowerCase();
    const matches = correctKeywords.filter(kw => ansLower.includes(kw)).length;
    const score = Math.min(100, Math.round((matches / Math.max(correctKeywords.length, 1)) * 100 + Math.random() * 10));
    const isCorrect = score >= 50;

    const fb = {
      question: q.q,
      userAnswer: ans || '(Javob berilmadi)',
      correctAnswer: q.a,
      score, isCorrect,
      comment: isCorrect
        ? ['Ajoyib! To\'g\'ri javob berdingiz.', 'Zo\'r! Tushuncha to\'g\'ri.', 'Barakalla! Yaxshi bilasiz.'][Math.floor(Math.random()*3)]
        : ['Noto\'g\'ri. Yana o\'rganing.', 'Yaxshi urinish, lekin to\'liq emas.', 'Bu savol uchun ko\'proq o\'rganish kerak.'][Math.floor(Math.random()*3)]
    };

    setFeedback(fb);
    setScores(prev => [...prev, score]);
    setAnswers(prev => [...prev, { ...fb }]);

    const voiceFB = isCorrect
      ? `To'g'ri! ${fb.comment} Ball: ${score}`
      : `Afsuski, javob to'liq emas. To'g'ri javob: ${q.a.slice(0,80)}`;

    speak(voiceFB, () => {
      if (qIndex + 1 < questions.length) {
        setTimeout(() => {
          setFeedback(null);
          setTranscript('');
          setQIndex(qIndex + 1);
          greetAndAsk(qIndex + 1);
        }, 1500);
      } else {
        speak('Ovozli qism yakunlandi! Endi texnik vazifalar qismiga o\'tamiz. Tayyor bo\'ling!', () => {
          const avg = Math.round([...scores, score].reduce((a,b)=>a+b,0) / ([...scores, score].length));
          setInterviewState(prev => ({
            ...prev, stage:2, answers:[...answers, fb],
            scores: { voice: avg, coding:0, total:0 }, timeSpent:totalTime
          }));
          navigate('coding-interview');
        });
      }
    });
  };

  const skip = () => {
    recognitionRef.current?.stop();
    evaluateAnswer('');
  };

  const formatTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div style={{ minHeight:'100vh', background:'var(--bg-dark)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'20px', position:'relative' }}>
      {/* BG */}
      <div style={{ position:'fixed', inset:0, background:'radial-gradient(ellipse at 50% 0%, rgba(108,99,255,0.12) 0%, transparent 60%)', pointerEvents:'none' }}/>

      {/* Header */}
      <div style={{ position:'fixed', top:0, left:0, right:0, padding:'16px 32px', background:'rgba(10,11,20,0.9)', backdropFilter:'blur(20px)', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', zIndex:100 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <span style={{ fontSize:20 }}>🎤</span>
          <span style={{ fontWeight:700 }}>Bosqich 1: Ovozli Intervyu</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:20 }}>
          <div style={{ fontFamily:'JetBrains Mono, monospace', color:'var(--primary)', fontSize:18, fontWeight:700 }}>
            ⏱ {formatTime(totalTime)}
          </div>
          <div style={{ color:'var(--text-secondary)', fontSize:13 }}>
            {qIndex+1} / {questions.length}
          </div>
          <button onClick={() => { synthRef.current?.cancel(); navigate('setup'); }} className="btn-danger" style={{padding:'8px 16px', fontSize:13}}>
            Chiqish
          </button>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ position:'fixed', top:60, left:0, right:0, height:3, background:'var(--border)' }}>
        <div style={{ height:'100%', background:'linear-gradient(90deg, #6C63FF, #FF6584)', width:`${((qIndex+1)/questions.length)*100}%`, transition:'width 0.6s ease' }}/>
      </div>

      {/* Main Content */}
      <div style={{ maxWidth:760, width:'100%', marginTop:80 }}>
        {/* AI Avatar */}
        <div style={{ textAlign:'center', marginBottom:40 }}>
          <div style={{ position:'relative', display:'inline-block' }}>
            <div style={{
              width:120, height:120, borderRadius:'50%',
              background:'linear-gradient(135deg, #6C63FF, #FF6584)',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:52, margin:'0 auto',
              boxShadow: aiSpeaking ? '0 0 40px rgba(108,99,255,0.6)' : '0 0 20px rgba(108,99,255,0.2)',
              transition:'box-shadow 0.3s ease',
              animation: aiSpeaking ? 'glow 1s ease-in-out infinite' : 'none'
            }}>🤖</div>
            {aiSpeaking && (
              <div style={{ position:'absolute', inset:-8, borderRadius:'50%', border:'3px solid rgba(108,99,255,0.4)', animation:'ripple 1.5s ease-out infinite' }}/>
            )}
          </div>
          <div style={{ marginTop:16, fontSize:14, color:'var(--text-secondary)' }}>
            {phase === 'speaking' ? '🔊 Gapirmoqda...' :
             phase === 'listening' ? '👂 Tinglayapman...' :
             phase === 'evaluating' ? '⚡ Baholamoqda...' :
             phase === 'manual' ? '✍️ Matn yozing' : '⏳ Tayyorlanmoqda...'}
          </div>
          {(aiSpeaking || userSpeaking) && (
            <div style={{ display:'flex', justifyContent:'center', marginTop:12 }}>
              <VoiceWaveform isActive={true} color={aiSpeaking ? '#6C63FF' : '#43E97B'} size="md" />
            </div>
          )}
        </div>

        {/* Question Card */}
        {questions[qIndex] && (
          <div className="glass-card" style={{ padding:32, marginBottom:24, textAlign:'center' }}>
            <div style={{ fontSize:12, color:'var(--text-muted)', marginBottom:8, textTransform:'uppercase', letterSpacing:1 }}>
              Savol {qIndex+1}/{questions.length}
            </div>
            <h2 style={{ fontSize:22, fontWeight:700, lineHeight:1.5, color:'white' }}>
              {questions[qIndex].q}
            </h2>
          </div>
        )}

        {/* Transcript / Manual Input */}
        <div className="glass-card" style={{ padding:24, marginBottom:24 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
            <span style={{ color: userSpeaking ? '#43E97B' : 'var(--text-muted)', fontSize:13 }}>
              {userSpeaking ? '🔴 Yozilmoqda...' : '📝 Javobingiz:'}
            </span>
          </div>
          {phase === 'manual' ? (
            <textarea className="input-field" rows={4} value={transcript}
              onChange={e => setTranscript(e.target.value)}
              placeholder="Javobingizni bu yerga yozing..."
              style={{ fontFamily:'Inter', resize:'vertical' }} />
          ) : (
            <div style={{ minHeight:80, color: transcript ? 'white' : 'var(--text-muted)', fontSize:16, lineHeight:1.7 }}>
              {transcript || (phase === 'listening' ? 'Gapiring yoki quyida "Javob berish" tugmasini bosing...' : '...')}
            </div>
          )}
        </div>

        {/* Feedback */}
        {feedback && (
          <div className="animate-bounceIn glass-card" style={{
            padding:24, marginBottom:24,
            borderColor: feedback.isCorrect ? 'rgba(67,233,123,0.4)' : 'rgba(255,77,106,0.4)',
            background: feedback.isCorrect ? 'rgba(67,233,123,0.05)' : 'rgba(255,77,106,0.05)'
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:12 }}>
              <span style={{ fontSize:24 }}>{feedback.isCorrect ? '✅' : '❌'}</span>
              <span style={{ fontWeight:700, fontSize:18, color: feedback.isCorrect ? '#43E97B' : '#FF4D6A' }}>
                {feedback.isCorrect ? 'To\'g\'ri!' : 'Noto\'g\'ri'} — {feedback.score} ball
              </span>
            </div>
            <p style={{ color:'var(--text-secondary)', fontSize:14, marginBottom:8 }}>{feedback.comment}</p>
            {!feedback.isCorrect && (
              <p style={{ fontSize:13, color:'var(--text-muted)' }}>
                💡 To'g'ri javob: <span style={{ color:'white' }}>{feedback.correctAnswer}</span>
              </p>
            )}
          </div>
        )}

        {/* Controls */}
        <div style={{ display:'flex', gap:12, justifyContent:'center' }}>
          {phase === 'listening' && (
            <>
              <button onClick={submitAnswer} className="btn-success" style={{ padding:'14px 32px', fontSize:15 }}>
                ✋ Javob berish
              </button>
              <button onClick={skip} className="btn-secondary" style={{ padding:'14px 24px' }}>
                ⏭ O'tkazib yuborish
              </button>
            </>
          )}
          {phase === 'manual' && (
            <button onClick={() => evaluateAnswer(transcript)} className="btn-primary" style={{ padding:'14px 32px' }}>
              📤 Javobni Yuborish
            </button>
          )}
        </div>

        {/* Score mini bar */}
        {scores.length > 0 && (
          <div style={{ marginTop:32, display:'flex', justifyContent:'center', gap:8 }}>
            {scores.map((s,i) => (
              <div key={i} style={{
                width:36, height:36, borderRadius:'50%', fontSize:11, fontWeight:700,
                background: s>=70 ? 'rgba(67,233,123,0.2)' : 'rgba(255,77,106,0.2)',
                border: `2px solid ${s>=70 ? '#43E97B' : '#FF4D6A'}`,
                color: s>=70 ? '#43E97B' : '#FF4D6A',
                display:'flex', alignItems:'center', justifyContent:'center'
              }}>{s}</div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

const CodingInterviewPage = () => {
  const { navigate, interviewConfig, interviewState, setInterviewState } = useApp();
  const [chalIdx, setChalIdx] = useState(0);
  const [code, setCode] = useState('');
  const [output, setOutput] = useState('');
  const [outputType, setOutputType] = useState('idle'); // idle|running|success|error
  const [scores, setScores] = useState([]);
  const [solvedAll, setSolvedAll] = useState(false);
  const [timer, setTimer] = useState(0);
  const [showHint, setShowHint] = useState(false);
  const [theme, setTheme] = useState('dark');
  const timerRef = useRef(null);
  const synthRef = useRef(window.speechSynthesis);

  const level = interviewConfig?.level || 'junior';
  const challenges = CODING_CHALLENGES[level] || CODING_CHALLENGES.junior;

  useEffect(() => {
    setCode(challenges[chalIdx]?.template || '');
    setOutput('');
    setOutputType('idle');
    setShowHint(false);
    setTimer(0);
  }, [chalIdx]);

  useEffect(() => {
    timerRef.current = setInterval(() => setTimer(t => t+1), 1000);
    // Welcome voice
    const synth = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance('Ikkinchi bosqich: texnik intervyu. Berilgan masalalarni hal qiling. Tayyor bo\'lsangiz boshlang!');
    u.lang = 'uz-UZ'; u.rate = 0.9;
    setTimeout(() => synth.speak(u), 500);
    return () => { clearInterval(timerRef.current); synth.cancel(); };
  }, []);

  const runCode = () => {
    setOutputType('running');
    setOutput('⚡ Ishga tushirilmoqda...');

    setTimeout(() => {
      try {
        const logs = [];
        const mockConsole = { log: (...args) => logs.push(args.map(a => JSON.stringify(a) !== undefined ? (typeof a === 'object' ? JSON.stringify(a) : String(a)) : 'undefined').join(' ')) };
        const fn = new Function('console', code);
        fn(mockConsole);
        const result = logs.join('\n');
        setOutput(result || '(chiqish yo\'q)');
        setOutputType('success');

        const chal = challenges[chalIdx];
        const expected = chal.expected?.trim();
        if (expected && result.trim().startsWith(expected.split('\n')[0].trim())) {
          const score = Math.max(60, 100 - Math.floor(timer/10));
          setScores(prev => { const n=[...prev]; n[chalIdx]=score; return n; });
          const synth = window.speechSynthesis;
          const u = new SpeechSynthesisUtterance(`Barakalla! Masala to'g'ri yechildi. ${score} ball!`);
          u.lang='uz-UZ'; u.rate=0.9; synth.speak(u);
        }
      } catch(err) {
        setOutput(`❌ Xato: ${err.message}`);
        setOutputType('error');
      }
    }, 600);
  };

  const resetCode = () => { setCode(challenges[chalIdx]?.template || ''); setOutput(''); setOutputType('idle'); };

  const nextChallenge = () => {
    if (chalIdx + 1 < challenges.length) {
      setChalIdx(chalIdx + 1);
    } else {
      const avgCodingScore = scores.length > 0 ? Math.round(scores.reduce((a,b)=>a+(b||0),0)/challenges.length) : 60;
      const voiceScore = interviewState.scores.voice || 70;
      const total = Math.round(voiceScore * 0.4 + avgCodingScore * 0.6);
      setInterviewState(prev => ({
        ...prev,
        scores: { voice: voiceScore, coding: avgCodingScore, total },
        codingAnswers: scores
      }));
      const synth = window.speechSynthesis;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(`Intervyu tugadi! Umumiy ballingiz ${total} ball. Natijalar sahifasiga o'tamiz.`);
      u.lang='uz-UZ'; u.rate=0.9;
      synth.speak(u);
      setTimeout(() => navigate('results'), 2000);
    }
  };

  const formatTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const chal = challenges[chalIdx];
  const isSolved = scores[chalIdx] !== undefined;

  return (
    <div style={{ minHeight:'100vh', background:'var(--bg-dark)', display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{
        padding:'14px 24px', background:'rgba(10,11,20,0.95)', backdropFilter:'blur(20px)',
        borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <span style={{ fontSize:20 }}>💻</span>
          <span style={{ fontWeight:700 }}>Bosqich 2: Texnik Intervyu</span>
          <div className="badge badge-junior" style={{
            background: level==='junior' ? 'rgba(67,233,123,0.15)' : level==='middle' ? 'rgba(77,195,255,0.15)' : 'rgba(255,184,77,0.15)',
            color: level==='junior' ? '#43E97B' : level==='middle' ? '#4DC3FF' : '#FFB84D',
          }}>{level}</div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <div style={{ fontFamily:'JetBrains Mono, monospace', color: timer>300?'#FF4D6A':'var(--primary)', fontSize:18, fontWeight:700 }}>
            ⏱ {formatTime(timer)}
          </div>
          <div style={{ display:'flex', gap:6 }}>
            {challenges.map((_,i) => (
              <div key={i} onClick={() => setChalIdx(i)} style={{
                width:32, height:32, borderRadius:8, cursor:'pointer',
                background: scores[i] ? 'rgba(67,233,123,0.2)' : i===chalIdx ? 'rgba(108,99,255,0.3)' : 'rgba(255,255,255,0.05)',
                border: `1px solid ${scores[i] ? '#43E97B' : i===chalIdx ? 'var(--primary)' : 'var(--border)'}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:12, fontWeight:700, color: scores[i] ? '#43E97B' : i===chalIdx ? 'var(--primary)' : 'var(--text-muted)'
              }}>{scores[i] ? '✓' : i+1}</div>
            ))}
          </div>
          <button onClick={() => { synthRef.current?.cancel(); navigate('setup'); }} className="btn-danger" style={{padding:'8px 16px', fontSize:13}}>
            Chiqish
          </button>
        </div>
      </div>

      {/* Main Editor Layout */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'1fr 1fr', gap:0, overflow:'hidden' }}>
        {/* Left: Problem */}
        <div style={{ borderRight:'1px solid var(--border)', overflow:'auto', padding:24 }}>
          {/* Challenge header */}
          <div style={{ marginBottom:20 }}>
            <div style={{ display:'flex', align:'center', gap:10, marginBottom:12, flexWrap:'wrap' }}>
              <span style={{ fontWeight:800, fontSize:20 }}>{chal?.title}</span>
              <span style={{
                padding:'4px 10px', borderRadius:20, fontSize:12, fontWeight:600,
                background: chal?.difficulty==='Oson' ? 'rgba(67,233,123,0.15)' : chal?.difficulty==="O'rta" ? 'rgba(255,184,77,0.15)' : 'rgba(255,77,106,0.15)',
                color: chal?.difficulty==='Oson' ? '#43E97B' : chal?.difficulty==="O'rta" ? '#FFB84D' : '#FF4D6A'
              }}>{chal?.difficulty}</span>
              {isSolved && <span style={{ padding:'4px 10px', borderRadius:20, fontSize:12, background:'rgba(67,233,123,0.15)', color:'#43E97B' }}>✓ Yechildi: {scores[chalIdx]} ball</span>}
            </div>
            <div style={{
              background:'rgba(255,255,255,0.03)', borderRadius:12, padding:20,
              border:'1px solid var(--border)', color:'var(--text-secondary)',
              fontSize:14, lineHeight:1.8, whiteSpace:'pre-wrap'
            }}>{chal?.description}</div>
          </div>

          {/* Hint */}
          <div style={{ marginBottom:20 }}>
            <button onClick={() => setShowHint(!showHint)} style={{
              background:'rgba(255,184,77,0.1)', border:'1px solid rgba(255,184,77,0.3)',
              color:'#FFB84D', padding:'8px 16px', borderRadius:8, cursor:'pointer', fontSize:13, fontWeight:500
            }}>
              {showHint ? '🔼 Maslahatni yashirish' : '💡 Maslahat ko\'rish'}
            </button>
            {showHint && (
              <div style={{ marginTop:12, padding:14, background:'rgba(255,184,77,0.07)', borderRadius:10, border:'1px solid rgba(255,184,77,0.2)', color:'#FFB84D', fontSize:13 }}>
                💡 {chal?.hint}
              </div>
            )}
          </div>

          {/* Output */}
          <div style={{ background:'#080910', borderRadius:12, border:'1px solid var(--border)', overflow:'hidden' }}>
            <div style={{
              padding:'10px 16px',
              borderBottom:'1px solid var(--border)',
              display:'flex', alignItems:'center', gap:8, fontSize:13
            }}>
              <span style={{
                color: outputType==='success' ? '#43E97B' : outputType==='error' ? '#FF4D6A' : outputType==='running' ? '#FFB84D' : 'var(--text-muted)'
              }}>
                {outputType==='success' ? '✅' : outputType==='error' ? '❌' : outputType==='running' ? '⚡' : '▶'} Natija
              </span>
            </div>
            <div style={{
              padding:16, fontFamily:'JetBrains Mono, monospace', fontSize:13,
              color: outputType==='error' ? '#FF4D6A' : outputType==='success' ? '#43E97B' : 'var(--text-secondary)',
              minHeight:120, whiteSpace:'pre-wrap', lineHeight:1.6
            }}>
              {output || 'Kodni ishga tushiring...'}
            </div>
          </div>
        </div>

        {/* Right: Code Editor */}
        <div style={{ display:'flex', flexDirection:'column', overflow:'hidden' }}>
          {/* Editor Toolbar */}
          <div style={{
            padding:'10px 16px', borderBottom:'1px solid var(--border)',
            display:'flex', alignItems:'center', justifyContent:'space-between', background:'#0D0E1A'
          }}>
            <div style={{ display:'flex', gap:6 }}>
              {['●','●','●'].map((d,i) => (
                <div key={i} style={{ width:12, height:12, borderRadius:'50%', background:['#FF5F57','#FEBC2E','#28C840'][i] }}/>
              ))}
            </div>
            <span style={{ fontSize:12, color:'var(--text-muted)', fontFamily:'JetBrains Mono, monospace' }}>
              solution.js
            </span>
            <button onClick={resetCode} style={{ background:'transparent', border:'none', color:'var(--text-muted)', fontSize:12, cursor:'pointer' }}>
              🔄 Reset
            </button>
          </div>

          {/* Code Editor */}
          <textarea
            className="code-editor"
            value={code}
            onChange={e => setCode(e.target.value)}
            style={{ flex:1, borderRadius:0, border:'none', borderBottom:'1px solid var(--border)', resize:'none' }}
            onKeyDown={e => {
              if (e.key === 'Tab') { e.preventDefault(); const s=e.target.selectionStart; const v=code; setCode(v.slice(0,s)+'  '+v.slice(s)); setTimeout(()=>{ e.target.selectionStart=e.target.selectionEnd=s+2; }, 0); }
            }}
            spellCheck={false}
          />

          {/* Run Controls */}
          <div style={{ padding:16, background:'#0D0E1A', display:'flex', gap:10, borderTop:'1px solid var(--border)' }}>
            <button onClick={runCode} className="btn-success" style={{ flex:1, justifyContent:'center', padding:'12px' }}>
              ▶ Ishga Tushurish
            </button>
            <button onClick={nextChallenge} className="btn-primary" style={{ padding:'12px 20px' }}>
              {chalIdx + 1 < challenges.length ? 'Keyingisi →' : '🏁 Yakunlash'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

                  ✅ To'lovni Tasdiqlash
                </button>
                <button onClick={() => setPayStep(1)} style={{ marginTop:10, background:'transparent', border:'none', color:'var(--text-muted)', cursor:'pointer', fontSize:13 }}>
                  ← Orqaga
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Success */}
      {payDone && (
        <div className="modal-overlay">
          <div className="modal-box animate-bounceIn" style={{ textAlign:'center', maxWidth:380 }}>
            <div style={{ fontSize:80 }}>🎉</div>
            <h3 style={{ fontSize:24, fontWeight:800, margin:'16px 0 8px', color:'#43E97B' }}>
              To'lov muvaffaqiyatli!
            </h3>
            <p style={{ color:'var(--text-secondary)' }}>PRO versiya faollashtirildi. Xush kelibsiz!</p>
          </div>
        </div>
      )}

      {/* FAQ */}
      <div style={{ maxWidth:720, margin:'0 auto' }}>
        <h2 style={{ textAlign:'center', fontSize:28, fontWeight:800, marginBottom:32 }}>Ko'p so'raladigan savollar</h2>
        {[
          { q:"Bepul versiyada nima bor?", a:"Oyiga 3 ta intervyu, 5 ta savol va asosiy baholash kiradi." },
          { q:"To'lovni bekor qilsam bo'ladimi?", a:"Ha, istalgan vaqt hech qanday jarimosiz bekor qilish mumkin." },
          { q:"Sertifikat berasilarsizmi?", a:"PRO obunachilarga har yakunlangan intervyu uchun PDF sertifikat beriladi." },
          { q:"Qanday to'lov usullari qo'llab-quvvatlanadi?", a:"Payme va Click orqali o'zbek bank kartalariga to'lash mumkin." },
        ].map((faq,i) => (
          <div key={i} className="glass-card" style={{ padding:20, marginBottom:12, cursor:'pointer' }}>
            <div style={{ fontWeight:600, marginBottom:6 }}>❓ {faq.q}</div>
            <div style={{ fontSize:14, color:'var(--text-secondary)' }}>{faq.a}</div>
          </div>
        ))}
      </div>
    </div>
  );
};
