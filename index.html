<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MockInterview Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#6C63FF;--sc:#FF6584;--ac:#43E97B;
  --bg:#0A0B14;--card:#12131F;
  --t1:#fff;--t2:#A0A3B1;--t3:#6B6E82;
  --br:#2A2B3D;--yel:#FFB84D;--red:#FF4D6A;--blue:#4DC3FF;
}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--br);border-radius:3px}

@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,99,255,.5)}50%{box-shadow:0 0 0 14px rgba(108,99,255,0)}}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes barUp{0%,100%{height:6px}50%{height:22px}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(108,99,255,.3)}50%{box-shadow:0 0 48px rgba(108,99,255,.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.gt{background:linear-gradient(135deg,#6C63FF,#FF6584,#43E97B);background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:grad 4s ease infinite}
.card{background:rgba(18,19,31,.9);border:1px solid rgba(255,255,255,.07);border-radius:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;
     font-size:15px;font-weight:600;cursor:pointer;padding:12px 28px;transition:.2s}
.btn-pr{background:linear-gradient(135deg,#6C63FF,#8B85FF);color:#fff}
.btn-pr:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(108,99,255,.45)}
.btn-sc{background:rgba(108,99,255,.12);color:#8B85FF;border:1px solid rgba(108,99,255,.3)}
.btn-sc:hover{background:rgba(108,99,255,.22)}
.btn-gr{background:linear-gradient(135deg,#43E97B,#38F9D7);color:#0A0B14}
.btn-gr:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(67,233,123,.4)}
.btn-rd{background:linear-gradient(135deg,#FF4D6A,#FF6584);color:#fff}
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--br);color:var(--t1);
     padding:12px 16px;border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
textarea.inp{resize:vertical}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.b-gr{background:rgba(67,233,123,.15);color:#43E97B;border:1px solid rgba(67,233,123,.3)}
.b-bl{background:rgba(77,195,255,.15);color:#4DC3FF;border:1px solid rgba(77,195,255,.3)}
.b-yl{background:rgba(255,184,77,.15);color:#FFB84D;border:1px solid rgba(255,184,77,.3)}
.prog{height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.prog-f{height:100%;border-radius:4px;transition:width .8s ease}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:999;padding:14px 32px;
     display:flex;align-items:center;justify-content:space-between;
     background:rgba(10,11,20,.92);backdrop-filter:blur(20px);
     border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo-ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6C63FF,#FF6584);
             display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-links{display:flex;gap:4px}
.nlink{background:transparent;border:none;color:var(--t2);padding:8px 15px;border-radius:8px;
       font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.nlink:hover,.nlink.act{color:var(--pr);background:rgba(108,99,255,.12)}
.nav-auth{display:flex;gap:8px}

/* SECTIONS */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:100px 20px 60px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.6}
.hero h1{font-size:clamp(34px,6.5vw,76px);font-weight:900;line-height:1.12;margin-bottom:24px}
.hero p{font-size:clamp(15px,2.2vw,19px);color:var(--t2);max-width:600px;line-height:1.8;margin-bottom:44px}
section{padding:72px 20px;max-width:1200px;margin:0 auto}
.sec-title{font-size:clamp(24px,4vw,44px);font-weight:900;margin-bottom:12px;text-align:center}
.sec-sub{color:var(--t2);font-size:16px;text-align:center;margin-bottom:44px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}

/* SETUP */
#page-setup{padding:110px 20px 60px;min-height:100vh}
.setup-inner{max-width:820px;margin:0 auto}
.steps{display:flex;align-items:center;justify-content:center;margin-bottom:44px}
.s-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:.3s}
.s-line{width:80px;height:2px;margin:0 6px;margin-bottom:20px;transition:.3s}
.s-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.s-lab{font-size:12px;transition:.3s}
.sel-card{padding:20px;cursor:pointer;transition:.25s;border:1px solid rgba(255,255,255,.07)!important}
.sel-card:hover{border-color:rgba(108,99,255,.35)!important;transform:translateY(-2px)}

/* VOICE INTERVIEW */
#page-voice{min-height:100vh;background:var(--bg)}
.vi-hdr{position:fixed;top:0;left:0;right:0;z-index:99;padding:13px 26px;
        background:rgba(10,11,20,.97);border-bottom:1px solid var(--br);
        display:flex;align-items:center;justify-content:space-between}
.vi-prog{position:fixed;top:57px;left:0;right:0;height:3px;background:var(--br)}
.vi-prog-f{height:100%;background:linear-gradient(90deg,#6C63FF,#FF6584);transition:width .6s}
.vi-body{padding:82px 20px 40px;max-width:740px;margin:0 auto}
.ai-av{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#6C63FF,#FF6584);
       display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto;transition:.3s}
.ai-av.speak{box-shadow:0 0 0 0 rgba(108,99,255,.6);animation:glow 1s ease-in-out infinite}
.vbars{display:flex;align-items:flex-end;gap:4px;height:34px;justify-content:center}
.vb{width:4px;border-radius:2px;animation:barUp .7s ease-in-out infinite}

/* CODE EDITOR */
#page-coding{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.ci-hdr{padding:12px 20px;background:rgba(10,11,20,.98);border-bottom:1px solid var(--br);
        display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ci-body{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ci-left{border-right:1px solid var(--br);overflow-y:auto;padding:20px}
.ci-right{display:flex;flex-direction:column;min-height:0}
.ci-nbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--br);display:flex;
         align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;
         background:rgba(255,255,255,.04);color:var(--t3);transition:.2s}
.ci-nbtn.act{background:rgba(108,99,255,.22);border-color:var(--pr);color:var(--pr)}
.ci-nbtn.done{background:rgba(67,233,123,.15);border-color:#43E97B;color:#43E97B}
.code-ta{flex:1;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;
         background:#0C0D1A;color:#E2E4FF;border:none;outline:none;padding:18px;
         resize:none;tab-size:2;overflow-y:auto;min-height:0}
.out-box{background:#07080F;border-top:1px solid var(--br);padding:14px;
         font-family:monospace;font-size:12px;min-height:90px;max-height:150px;
         white-space:pre-wrap;overflow-y:auto;color:var(--t2)}
.ci-bar{padding:12px 16px;background:#0D0E1A;display:flex;gap:10px;border-top:1px solid var(--br);flex-shrink:0}
.mac{width:12px;height:12px;border-radius:50%}

/* RESULTS */
#page-results{padding:100px 20px 60px;min-height:100vh}
.res-wrap{max-width:960px;margin:0 auto}
.ring{width:200px;height:200px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative}
.ring-in{position:absolute;inset:18px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tab-row{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:22px}
.tb{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--t2);transition:.2s}
.tb.act{background:rgba(108,99,255,.16);color:var(--pr);border:1px solid rgba(108,99,255,.3)}

/* MODALS */
.modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.75);
       backdrop-filter:blur(8px);align-items:center;justify-content:center}
.modal.open{display:flex;animation:fadeIn .2s}
.mbox{background:var(--card);border:1px solid var(--br);border-radius:22px;
      padding:34px;max-width:480px;width:92%;animation:bounceIn .35s;position:relative}

/* MISC */
.cta-sec{padding:72px 20px;text-align:center;background:linear-gradient(135deg,rgba(108,99,255,.08),rgba(255,101,132,.05));border-top:1px solid var(--br);border-bottom:1px solid var(--br)}
footer{padding:44px 36px;border-top:1px solid var(--br)}
.foot-in{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
.fl{color:var(--t3);font-size:13px;margin-bottom:8px;cursor:pointer}
.fl:hover{color:var(--pr)}
@media(max-width:720px){
  .nav{padding:12px 16px}.ci-body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .nav-links{display:none}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-logo" onclick="go('landing')">
    <div class="nav-logo-ic">🎯</div>
    <span style="font-weight:800;font-size:18px">Mock<span class="gt">Interview</span></span>
    <span id="pro-badge" class="badge" style="display:none;background:linear-gradient(135deg,#FFD700,#FFA500);color:#0A0B14;margin-left:6px">PRO</span>
  </div>
  <div class="nav-links">
    <button class="nlink act" id="nl-landing" onclick="go('landing')">🏠 Bosh sahifa</button>
    <button class="nlink" id="nl-pricing" onclick="go('pricing')">💎 Narxlar</button>
    <button class="nlink" id="nl-leaderboard" onclick="go('leaderboard')">🏆 Reyting</button>
    <button class="nlink" id="nl-dashboard" style="display:none" onclick="go('dashboard')">📊 Dashboard</button>
  </div>
  <div class="nav-auth" id="nav-auth"></div>
</nav>

<!-- PAGES -->
<div id="page-landing" style="display:block"></div>
<div id="page-setup" style="display:none"></div>
<div id="page-voice" style="display:none"></div>
<div id="page-coding" style="display:none"></div>
<div id="page-results" style="display:none"></div>
<div id="page-dashboard" style="display:none"></div>
<div id="page-pricing" style="display:none"></div>
<div id="page-leaderboard" style="display:none"></div>

<!-- AUTH MODAL -->
<div class="modal" id="m-auth">
  <div class="mbox">
    <button onclick="mclose('auth')" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer">✕</button>
    <div style="text-align:center;margin-bottom:26px">
      <div style="font-size:38px;margin-bottom:10px">🎯</div>
      <h2 id="auth-h" style="font-size:21px;font-weight:700;margin-bottom:6px">Xush kelibsiz!</h2>
      <p id="auth-p" style="color:var(--t2);font-size:14px">Davom etish uchun kiring</p>
    </div>
    <div id="auth-err" style="display:none;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.3);border-radius:8px;padding:10px;color:#FF4D6A;font-size:13px;margin-bottom:12px"></div>
    <form onsubmit="authSubmit(event)" style="display:flex;flex-direction:column;gap:11px">
      <input id="a-name" class="inp" placeholder="Ismingiz" style="display:none">
      <input id="a-email" class="inp" type="email" placeholder="Email" required>
      <input id="a-pass" class="inp" type="password" placeholder="Parol" required>
      <button type="submit" id="a-btn" class="btn btn-pr" style="justify-content:center;padding:13px">🚀 Kirish</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:14px;color:var(--t2)">
      <span id="a-sw-t">Hisobingiz yo'qmi? </span>
      <span style="color:var(--pr);cursor:pointer;font-weight:600" onclick="authToggle()"><span id="a-sw-l">Ro'yxatdan o'ting</span></span>
    </div>
  </div>
</div>

<!-- PAY MODAL -->
<div class="modal" id="m-pay">
  <div class="mbox" style="max-width:400px">
    <button onclick="mclose('pay')" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer">✕</button>
    <div id="pay-c"></div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="m-ok">
  <div class="mbox" style="text-align:center;max-width:340px;animation:bounceIn .4s">
    <div style="font-size:68px;margin-bottom:14px">🎉</div>
    <h3 style="font-size:21px;font-weight:800;color:#43E97B;margin-bottom:8px">To'lov muvaffaqiyatli!</h3>
    <p style="color:var(--t2)">PRO versiya faollashtirildi. Xush kelibsiz!</p>
  </div>
</div>

<script>
// ===================== STATE =====================
var S = {
  page:'landing', user:null, isPro:false, authMode:'login',
  billing:'monthly', payMethod:null, payStep:1,
  setupStep:1, level:null, dir:null,
  ivLevel:'junior', ivDir:'fullstack',
  session:{answers:[],voiceScore:0,codingScore:0,total:0,timeSpent:0},
  vi:{qi:0,phase:'intro',text:'',fb:null,scores:[],time:0},
  ci:{idx:0,code:'',out:'',outType:'idle',scores:[],time:0},
  resTab:'overview', dashTab:'stats'
};
try{ var u=localStorage.getItem('mip'); if(u) S.user=JSON.parse(u); }catch(e){}

// ===================== QUESTIONS =====================
var QS = {
  junior:[
    {q:"HTML5 da semantic teglari nima?",a:"semantic teglari header footer main section article nav aside sahifaning strukturasini anglatadi"},
    {q:"DOCTYPE ning vazifasi nima?",a:"DOCTYPE brauzerga hujjat turini bildiradi standart rejimda ishlashni ta'minlaydi"},
    {q:"id va class atributlarining farqi nima?",a:"id noyob identifikator class bir nechta elementda qayta ishlatilishi mumkin"},
    {q:"Flexbox nima va qachon ishlatiladi?",a:"flexbox bir o'lchovli layout elementlarni qator ustunda tartiblashtiradi align justify"},
    {q:"var let const farqlari nimada?",a:"var function scope let const block scope const qayta tayinlanmaydi"},
    {q:"Promise nima?",a:"Promise asinxron operatsiyaning natijasini ifodalaydi pending fulfilled rejected"},
  ],
  middle:[
    {q:"Closure nima? Misol keltiring.",a:"Closure inner function outer scope ga kirish module pattern private variables"},
    {q:"Event Loop qanday ishlaydi?",a:"Call stack Web APIs Callback queue Microtask queue async boshqaradi"},
    {q:"useMemo va useCallback farqi nima?",a:"useMemo qiymatni useCallback funksiyani memoize qiladi re-render oldini oladi"},
    {q:"async/await va Promise farqi nima?",a:"async await Promise sinxron ko'rinishda try catch bilan xatolarni tutadi"},
    {q:"React Context vs Redux?",a:"Context oddiy state sharing Redux murakkab global state time-travel debugging"},
    {q:"CSS Grid va Flexbox farqi?",a:"Grid ikki o'lchovli layout Flexbox bir o'lchovli layout uchun"},
  ],
  senior:[
    {q:"V8 engine qanday optimizatsiya qiladi?",a:"JIT compilation hidden classes inline caching garbage collection monomorphic code"},
    {q:"Web Workers va Service Workers?",a:"Web Workers heavy computation Service Workers offline caching push notifications"},
    {q:"React 18 Concurrent Mode nima?",a:"concurrent rendering interruptible useTransition useDeferredValue Suspense streaming"},
    {q:"Critical Rendering Path optimizatsiya?",a:"render-blocking resource preload prefetch inline critical CSS defer scripts"},
    {q:"Memory leak oldini olish?",a:"circular references detached DOM nodes event listener cleanup WeakMap WeakRef"},
    {q:"Micro-frontend architecture?",a:"Module Federation single-spa iframe web components shared state routing"},
  ]
};

// ===================== CHALLENGES =====================
var CH = {
  junior:[
    {t:"Palindrome",d:"Oson",
     desc:"isPalindrome(str) funksiya yozing:\n'racecar' -> true, 'hello' -> false",
     code:"function isPalindrome(str) {\n  // yozing\n}\n\nconsole.log(isPalindrome('racecar')); // true\nconsole.log(isPalindrome('hello'));   // false",
     hint:"str === str.split('').reverse().join('')",
     ok:function(r){return r.includes('true')&&r.includes('false')}},
    {t:"Array Yig'indisi",d:"Oson",
     desc:"arraySum([1,2,3,4,5]) -> 15 bo'lsin",
     code:"function arraySum(arr) {\n  // yozing\n}\n\nconsole.log(arraySum([1,2,3,4,5]));\nconsole.log(arraySum([10,-5,3]));",
     hint:"reduce() yoki for loop ishlatish mumkin",
     ok:function(r){return r.includes('15')&&r.includes('8')}},
    {t:"FizzBuzz",d:"Oson",
     desc:"1-15 gacha: 3->Fizz, 5->Buzz, 15->FizzBuzz",
     code:"for(var i=1;i<=15;i++){\n  // yozing\n}",
     hint:"if(i%15===0) FizzBuzz, else if(i%3===0) Fizz ...",
     ok:function(r){return r.includes('FizzBuzz')&&r.includes('Fizz')}},
  ],
  middle:[
    {t:"Deep Clone",d:"O'rta",
     desc:"deepClone(obj) - JSON ishlatmang",
     code:"function deepClone(obj){\n  // yozing\n}\nvar a={x:{y:1}};\nvar b=deepClone(a);\nb.x.y=99;\nconsole.log(a.x.y); // 1\nconsole.log(b.x.y); // 99",
     hint:"Rekursiya: array va object alohida",
     ok:function(r){return r.includes('1')&&r.includes('99')}},
    {t:"Debounce",d:"O'rta",
     desc:"debounce(fn, delay) implement qiling",
     code:"function debounce(fn,delay){\n  // yozing\n}\nvar f=debounce(function(){console.log('called')},100);\nf();f();f();\nsetTimeout(function(){f();},200);",
     hint:"clearTimeout + setTimeout saqlang",
     ok:function(r){return r.includes('called')}},
    {t:"Flatten",d:"O'rta",
     desc:"[1,[2,[3,[4]]]] -> [1,2,3,4]",
     code:"function flatten(arr){\n  // yozing\n}\nconsole.log(flatten([1,[2,[3,[4]]]]));",
     hint:"arr.flat(Infinity) yoki rekursiv reduce()",
     ok:function(r){return r.includes('1')&&r.includes('4')}},
  ],
  senior:[
    {t:"EventEmitter",d:"Qiyin",
     desc:"on, off, once, emit metodlari",
     code:"class EventEmitter{\n  constructor(){this.evs={}}\n  // on, off, once, emit\n}\nvar e=new EventEmitter();\ne.on('x',function(v){console.log('got:',v)});\ne.once('y',function(){console.log('once!')});\ne.emit('x',42);\ne.emit('y');\ne.emit('y');",
     hint:"Map da listeners array, once uchun wrapper",
     ok:function(r){return r.includes('got: 42')&&(r.match(/once!/g)||[]).length===1}},
    {t:"Memoize",d:"Qiyin",
     desc:"memoize(fn) - natijani cache qiling",
     code:"function memoize(fn){\n  // yozing\n}\nvar calls=0;\nvar sq=memoize(function(n){calls++;return n*n;});\nconsole.log(sq(4));\nconsole.log(sq(4));\nconsole.log('calls:',calls);",
     hint:"Map yoki object cache, arguments key",
     ok:function(r){return r.includes('16')&&r.includes('calls: 1')}},
  ]
};
</script>
<script>
// ===================== ROUTER =====================
function go(page){
  // Hide all pages
  var pages=['landing','setup','voice','coding','results','dashboard','pricing','leaderboard'];
  for(var i=0;i<pages.length;i++){
    var el=document.getElementById('page-'+pages[i]);
    if(el) el.style.display='none';
  }
  // Show target
  var target=document.getElementById('page-'+page);
  if(!target){ console.error('Page not found: page-'+page); return; }
  target.style.display='block';
  S.page=page;
  window.scrollTo(0,0);

  // Nav active
  var navIds=['landing','pricing','leaderboard','dashboard'];
  for(var j=0;j<navIds.length;j++){
    var nl=document.getElementById('nl-'+navIds[j]);
    if(nl) nl.classList.toggle('act', navIds[j]===page);
  }

  // Nav hide on interview
  var nav=document.getElementById('nav');
  if(nav) nav.style.display=(page==='voice'||page==='coding')?'none':'flex';

  // Reset setup state when going to setup
  if(page==='setup'){
    S.setupStep=1; S.level=null; S.dir=null;
  }

  // Render
  var fns={
    landing:rLanding, setup:rSetup, voice:rVoice,
    coding:rCoding, results:rResults, dashboard:rDash,
    pricing:rPricing, leaderboard:rLeader
  };
  if(fns[page]) fns[page]();
}

function $id(id){ return document.getElementById(id); }
function fmt(s){ return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }

// ===================== NAV USER =====================
function updateNav(){
  var a=$id('nav-auth');
  var dl=$id('nl-dashboard');

function mopen(id, mode){
  if(id==='auth'){ S.authMode=mode||'login'; updateAuthModal(); }
  var m=$id('m-'+id); if(m) m.classList.add('open');
}
function mclose(id){ var m=$id('m-'+id); if(m) m.classList.remove('open'); }
function updateAuthModal(){
  var login=S.authMode==='login';

  if(p) p.textContent=login?'Davom etish uchun kiring':'Bepul boshlang';
  if(n) n.style.display=login?'none':'block';
  if(btn) btn.textContent=login?'🚀 Kirish':"✨ Ro'yxatdan o'tish";
  if(swt) swt.textContent=login?"Hisobingiz yo'qmi? ":"Hisobingiz bormi? ";
  if(swl) swl.textContent=login?"Ro'yxatdan o'ting":'Kiring';
  if(err) err.style.display='none';
}
function authToggle(){ S.authMode=S.authMode==='login'?'register':'login'; updateAuthModal(); }
function authSubmit(e){

  var email=$id('a-email').value.trim(), pass=$id('a-pass').value.trim();

  if(S.authMode==='register'&&!name){ if(err){err.textContent='⚠️ Ismingizni kiriting';err.style.display='block';} return; }
  S.user={id:Date.now(),name:S.authMode==='login'?email.split('@')[0]:name,email:email,joinDate:new Date().toLocaleDateString('uz-UZ')};
  localStorage.setItem('mip',JSON.stringify(S.user));
  mclose('auth'); updateNav();
}

updateNav();
go('landing');

<script>

  drawStep();
}
function drawSteps(){
  var el=$id('s-steps');
  if(!el) return;
  var labels=['Daraja',"Yo'nalish",'Boshlash'];
  var html='<div class="steps">';
  for(var i=0;i<3;i++){
    var active=S.setupStep>i, cur=S.setupStep===i+1;
    html+='<div class="s-item">'+
      '<div class="s-dot" style="background:'+(active||cur?'var(--pr)':'var(--br)')+';color:'+(active||cur?'#fff':'var(--t3)')+'">'+
        (S.setupStep>i+1?'✓':i+1)+
      '</div>'+
      '<span class="s-lab" style="color:'+(active||cur?'var(--pr)':'var(--t3)')+'">'+labels[i]+'</span>'+
    '</div>';
    if(i<2) html+='<div class="s-line" style="background:'+(S.setupStep>i+1?'var(--pr)':'var(--br)')+'"></div>';
  }
  html+='</div>';
  el.innerHTML=html;
}
function drawStep(){
  var el=$id('s-content');
  if(!el){ setTimeout(drawStep,30); return; }
  if(S.setupStep===1) drawStep1();
  else if(S.setupStep===2) drawStep2();
  else drawStep3();
}
function drawStep1(){

    ['junior','🌱','#43E97B','Junior','0–1 yil tajriba',['HTML','CSS','JS asoslari','React hooks']],

  // direct page switch without go() to avoid reset
  var pages=['landing','setup','voice','coding','results','dashboard','pricing','leaderboard'];
  for(var i=0;i<pages.length;i++){var el=$id('page-'+pages[i]);if(el)el.style.display='none';}
  var vp=$id('page-voice'); if(vp) vp.style.display='block';
  var nav=$id('nav'); if(nav) nav.style.display='none';
  S.page='voice';
  window.scrollTo(0,0);
  rVoice();
}
</script>
<script>
// ===================== VOICE INTERVIEW =====================
var viTimer=null, viRec=null, synth=window.speechSynthesis;
function rVoice(){
  var qs=QS[S.ivLevel]||QS.junior;
  var p=$id('page-voice');
  p.innerHTML=
    '<div id="vi-hdr" class="vi-hdr">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="font-size:17px">🎤</span>'+
        '<span style="font-weight:700">Bosqich 1: Ovozli Intervyu</span>'+
        '<span class="badge b-gr" style="text-transform:lowercase">'+S.ivLevel+'</span>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:16px">'+
        '<span id="vi-clk" style="font-family:monospace;font-size:17px;font-weight:700;color:var(--pr)">00:00</span>'+
        '<span id="vi-cnt" style="color:var(--t2);font-size:13px">1 / '+qs.length+'</span>'+
        '<button class="btn btn-rd" style="padding:7px 13px;font-size:12px" onclick="exitVI()">Chiqish</button>'+
      '</div>'+
    '</div>'+
    '<div class="vi-prog"><div class="vi-prog-f" id="vi-pf" style="width:'+(100/qs.length)+'%"></div></div>'+
    '<div class="vi-body" id="vi-body"></div>';

  clearInterval(viTimer);
  S.vi.time=0;
  viTimer=setInterval(function(){
    S.vi.time++;
    var c=$id('vi-clk'); if(c) c.textContent=fmt(S.vi.time);
  },1000);
  drawVI();
  setTimeout(function(){ viSpeak(S.vi.qi); },700);
}
function drawVI(){
  var qs=QS[S.ivLevel]||QS.junior;
  var q=qs[S.vi.qi];
  var phases={speaking:'🔊 Gapirmoqda...',listening:'👂 Tinglayapman...',evaluating:'⚡ Baholamoqda...',manual:'✍️ Matn yozing',intro:'⏳ Tayyorlanmoqda...'};
  var isSpeaking=S.vi.phase==='speaking', isListening=S.vi.phase==='listening';
  var b=$id('vi-body'); if(!b) return;
  b.innerHTML=
    '<div style="text-align:center;margin-bottom:28px">'+
      '<div style="position:relative;display:inline-block">'+
        '<div id="ai-av" class="ai-av'+(isSpeaking?' speak':'')+'">🤖</div>'+
      '</div>'+
      '<div style="margin-top:13px;font-size:14px;color:var(--t2)">'+(phases[S.vi.phase]||'...')+'</div>'+
      (isSpeaking||isListening?'<div class="vbars" style="margin-top:10px">'+Array.from({length:8},function(_,i){return '<div class="vb" style="height:'+(6+i*3)+'px;background:'+(isSpeaking?'var(--pr)':'#43E97B')+';animation-delay:'+(i*0.08)+'s"></div>';}).join('')+'</div>':'')+
    '</div>'+
    (q?'<div class="card" style="padding:26px;margin-bottom:18px;text-align:center">'+
      '<div style="font-size:11px;color:var(--t3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px">Savol '+(S.vi.qi+1)+' / '+qs.length+'</div>'+
      '<h2 style="font-size:19px;font-weight:700;line-height:1.6">'+q.q+'</h2>'+
    '</div>':'')+
    '<div class="card" style="padding:18px;margin-bottom:16px;min-height:80px">'+
      '<div style="font-size:13px;color:'+(isListening?'#43E97B':'var(--t3)')+';margin-bottom:9px">'+(isListening?'🔴 Yozilmoqda...':'📝 Javobingiz:')+'</div>'+
      (S.vi.phase==='manual'?
        '<textarea id="vi-ta" class="inp" rows="4" placeholder="Javobingizni bu yerga yozing...">'+S.vi.text+'</textarea>':
        '<div style="font-size:15px;line-height:1.7;color:'+(S.vi.text?'#fff':'var(--t3)')+'">'+
          (S.vi.text||(isListening?'Gapiring yoki quyida tugmani bosing...':'...'))+
        '</div>')+
    '</div>'+
    (S.vi.fb?
      '<div class="card" style="padding:18px;margin-bottom:16px;border-color:'+(S.vi.fb.ok?'rgba(67,233,123,.35)':'rgba(255,77,106,.35)')+';background:'+(S.vi.fb.ok?'rgba(67,233,123,.05)':'rgba(255,77,106,.05)')+'">'+
        '<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">'+
          '<span style="font-size:20px">'+(S.vi.fb.ok?'✅':'❌')+'</span>'+
          '<span style="font-weight:700;font-size:16px;color:'+(S.vi.fb.ok?'#43E97B':'var(--red)')+'">'+
            (S.vi.fb.ok?"To'g'ri!":'Noto\'g\'ri')+' — '+S.vi.fb.score+' ball</span>'+
        '</div>'+
        '<p style="color:var(--t2);font-size:14px">'+S.vi.fb.comment+'</p>'+
        (!S.vi.fb.ok&&q?'<p style="font-size:13px;color:var(--t3);margin-top:5px">💡 To\'g\'ri: <span style="color:#fff">'+q.a+'</span></p>':'')+
      '</div>':'')+
    '<div style="display:flex;gap:11px;justify-content:center">'+
      (isListening?
        '<button class="btn btn-gr" onclick="submitVI()" style="padding:13px 30px;font-size:14px">✋ Javob berish</button>'+
        '<button class="btn btn-sc" onclick="skipVI()" style="padding:13px 20px">⏭ O\'tkazish</button>':'')+
      (S.vi.phase==='manual'?'<button class="btn btn-pr" onclick="submitManual()" style="padding:13px 28px">📤 Yuborish</button>':'')+
    '</div>'+
    (S.vi.scores.length?
      '<div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px">'+
        S.vi.scores.map(function(sc){
          return '<div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid '+(sc>=70?'#43E97B':'var(--red)')+';color:'+(sc>=70?'#43E97B':'var(--red)')+';background:'+(sc>=70?'rgba(67,233,123,.1)':'rgba(255,77,106,.1)')+'">'+sc+'</div>';
        }).join('')+
      '</div>':'')+
    '';
}
function viSpeak(qi){
  var qs=QS[S.ivLevel]||QS.junior;
  if(qi>=qs.length){ viDone(); return; }
  S.vi.phase='speaking'; drawVI();
  var greeting=qi===0?"Assalomu alaykum! Men sizning AI intervyu assistentingizman. Bugun "+S.ivLevel+" darajasida frontend bo'yicha savol-javob o'tkazamiz. ":'';
  var text=greeting+(qi===0?'Birinchi':'')+" savol: "+qs[qi].q;
  viSay(text,function(){
    S.vi.phase='listening'; drawVI(); startSTT();
  });
}
function viSay(text,cb){
  if(!synth){ if(cb) cb(); return; }
  synth.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='uz-UZ'; u.rate=0.87; u.pitch=1.05;
  var vs=synth.getVoices();
  var v=vs.find(function(x){return x.lang.indexOf('uz')===0;})||vs.find(function(x){return x.lang.indexOf('ru')===0;})||vs[0];
  if(v) u.voice=v;
  u.onend=function(){ if(cb) cb(); };
  u.onerror=function(){ if(cb) cb(); };
  synth.speak(u);
}
function startSTT(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ S.vi.phase='manual'; S.vi.text=''; drawVI(); return; }
  viRec=new SR(); viRec.lang='uz-UZ'; viRec.continuous=false; viRec.interimResults=true;
  viRec.onresult=function(e){
    S.vi.text=Array.from(e.results).map(function(r){return r[0].transcript;}).join('');
    var el=$id('vi-body'); if(el){
      var div=el.querySelector('div[style*="line-height:1.7"]');
      if(div){div.textContent=S.vi.text;div.style.color='#fff';}
    }
  };
  viRec.onerror=function(){ S.vi.phase='manual'; drawVI(); };
  viRec.start();
  // Auto-stop after 15s
  viRec._t=setTimeout(function(){ if(viRec){viRec.stop();} setTimeout(function(){evalVI(S.vi.text);},400); },15000);
}
function submitVI(){ if(viRec){clearTimeout(viRec._t);viRec.stop();} setTimeout(function(){evalVI(S.vi.text);},300); }
function skipVI(){ if(viRec){clearTimeout(viRec._t);viRec.stop();} evalVI(''); }
function submitManual(){ var ta=$id('vi-ta'); evalVI(ta?ta.value:''); }
function evalVI(ans){
  var qs=QS[S.ivLevel]||QS.junior;
  var q=qs[S.vi.qi];
  var kws=q.a.toLowerCase().split(/\s+/).filter(function(w){return w.length>3;});
  var al=(ans||'').toLowerCase();
  var hits=kws.filter(function(k){return al.indexOf(k)>=0;}).length;
  var sc=Math.min(100,Math.round(hits/Math.max(kws.length,1)*100+Math.random()*8));
  var ok=sc>=48;
  var okC=["Ajoyib! To'g'ri javob.","Zo'r! Tushuncha to'g'ri.","Barakalla!"];
  var noC=["Noto'g'ri. Yana o'rganing.","Yaxshi urinish, to'liq emas.","Ko'proq o'rganish kerak."];
  S.vi.fb={ok:ok,score:sc,comment:(ok?okC:noC)[Math.floor(Math.random()*3)]};
  S.vi.scores.push(sc);
  S.session.answers.push({question:q.q,userAnswer:ans||'(berilmadi)',correctAnswer:q.a,score:sc,ok:ok});
  S.vi.phase='evaluating'; drawVI();
  var fbTxt=ok?"To'g'ri! "+S.vi.fb.comment+" Ball: "+sc:"Afsuski to'liq emas. To'g'ri javob: "+q.a.slice(0,60);
  viSay(fbTxt,function(){
    if(S.vi.qi+1<qs.length){
      setTimeout(function(){
        S.vi.fb=null; S.vi.text=''; S.vi.qi++;
        var pf=$id('vi-pf'); if(pf) pf.style.width=((S.vi.qi+1)/qs.length*100)+'%';
        var cnt=$id('vi-cnt'); if(cnt) cnt.textContent=(S.vi.qi+1)+' / '+qs.length;
        viSpeak(S.vi.qi);
      },800);
    } else {
      setTimeout(viDone,600);
    }
  });
}
function viDone(){
  var avg=S.vi.scores.length>0?Math.round(S.vi.scores.reduce(function(a,b){return a+b;},0)/S.vi.scores.length):60;
  S.session.voiceScore=avg; S.session.timeSpent=S.vi.time;
  clearInterval(viTimer);
  viSay("Ovozli qism yakunlandi! Endi texnik vazifalar qismiga o'tamiz.",function(){
    S.ci={idx:0,code:'',out:'',outType:'idle',scores:[],time:0};
    var chals=CH[S.ivLevel]||CH.junior;
    S.ci.code=chals[0].code;
    var pages=['landing','setup','voice','coding','results','dashboard','pricing','leaderboard'];
    for(var i=0;i<pages.length;i++){var el=$id('page-'+pages[i]);if(el)el.style.display='none';}
    var cp=$id('page-coding'); if(cp) cp.style.display='flex';
    var nav=$id('nav'); if(nav) nav.style.display='none';
    S.page='coding'; window.scrollTo(0,0); rCoding();
  });
}
function exitVI(){ clearInterval(viTimer); if(viRec){clearTimeout(viRec._t);viRec.stop();} if(synth)synth.cancel(); go('setup'); }
</script>
<script>
// ===================== CODING =====================
var ciTimer=null;
function rCoding(){
  var chals=CH[S.ivLevel]||CH.junior;
  var ch=chals[S.ci.idx];
  var p=$id('page-coding'); if(!p) return;
  p.innerHTML=
    '<div class="ci-hdr">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="font-size:17px">💻</span>'+
        '<span style="font-weight:700">Bosqich 2: Texnik Intervyu</span>'+
        '<span class="badge '+(S.ivLevel==='junior'?'b-gr':S.ivLevel==='middle'?'b-bl':'b-yl')+'">'+S.ivLevel+'</span>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:13px">'+
        '<span id="ci-clk" style="font-family:monospace;font-size:16px;font-weight:700;color:var(--pr)">00:00</span>'+
        '<div style="display:flex;gap:5px">'+
          chals.map(function(_,i){
            return '<div class="ci-nbtn'+(S.ci.scores[i]!==undefined?' done':i===S.ci.idx?' act':'')+'" onclick="switchCI('+i+')">'+
              (S.ci.scores[i]!==undefined?'✓':i+1)+'</div>';
          }).join('')+
        '</div>'+
        '<button class="btn btn-rd" style="padding:7px 13px;font-size:12px" onclick="exitCI()">Chiqish</button>'+
      '</div>'+
    '</div>'+
    '<div class="ci-body">'+
      '<div class="ci-left">'+
        '<div style="margin-bottom:16px">'+
          '<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap">'+
            '<span style="font-weight:800;font-size:18px">'+ch.t+'</span>'+
            '<span style="padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;'+
              'background:'+(ch.d==='Oson'?'rgba(67,233,123,.15)':ch.d==="O'rta"?'rgba(255,184,77,.15)':'rgba(255,77,106,.15)')+';'+
              'color:'+(ch.d==='Oson'?'#43E97B':ch.d==="O'rta"?'#FFB84D':'#FF4D6A')+'">'+ch.d+'</span>'+
            (S.ci.scores[S.ci.idx]!==undefined?'<span style="padding:4px 10px;border-radius:20px;font-size:12px;background:rgba(67,233,123,.15);color:#43E97B">✓ '+S.ci.scores[S.ci.idx]+' ball</span>':'')+
          '</div>'+
          '<div style="background:rgba(255,255,255,.03);border:1px solid var(--br);border-radius:11px;padding:16px;color:var(--t2);font-size:14px;line-height:1.8;white-space:pre-wrap">'+ch.desc+'</div>'+
        '</div>'+
        '<div style="margin-bottom:15px">'+
          '<button id="hint-btn" onclick="toggleHint()" style="background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);color:var(--yel);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px">💡 Maslahat ko\'rish</button>'+
          '<div id="hint-box" style="display:none;margin-top:9px;padding:12px;background:rgba(255,184,77,.07);border-radius:9px;border:1px solid rgba(255,184,77,.2);color:var(--yel);font-size:13px">💡 '+ch.hint+'</div>'+
        '</div>'+
        '<div style="border-radius:11px;overflow:hidden;border:1px solid var(--br)">'+
          '<div style="padding:9px 13px;border-bottom:1px solid var(--br);font-size:13px">'+
            '<span style="color:'+(S.ci.outType==='success'?'#43E97B':S.ci.outType==='error'?'var(--red)':S.ci.outType==='running'?'var(--yel)':'var(--t3)')+'">'+
              ({success:'✅',error:'❌',running:'⚡',idle:'▶'}[S.ci.outType]||'▶')+' Natija</span>'+
          '</div>'+
          '<div id="ci-out" class="out-box" style="color:'+(S.ci.outType==='error'?'var(--red)':S.ci.outType==='success'?'#43E97B':'var(--t2)')+'">'+
            (S.ci.out||'Kodni ishga tushiring...')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="ci-right">'+
        '<div style="padding:9px 13px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;background:#0C0D1A">'+
          '<div style="display:flex;gap:5px">'+
            '<div class="mac" style="background:#FF5F57"></div>'+
            '<div class="mac" style="background:#FEBC2E"></div>'+
            '<div class="mac" style="background:#28C840"></div>'+
          '</div>'+
          '<span style="font-size:12px;color:var(--t3);font-family:monospace">solution.js</span>'+
          '<button onclick="resetCI()" style="background:none;border:none;color:var(--t3);font-size:12px;cursor:pointer">🔄 Reset</button>'+
        '</div>'+
        '<textarea id="ci-code" class="code-ta" onkeydown="tabCI(event)" spellcheck="false">'+S.ci.code+'</textarea>'+
        '<div class="ci-bar">'+
          '<button class="btn btn-gr" onclick="runCI()" style="flex:1;justify-content:center;padding:12px;font-size:14px">▶ Ishga Tushurish</button>'+
          '<button class="btn btn-pr" onclick="nextCI()" style="padding:12px 17px">'+
            (S.ci.idx+1<chals.length?'Keyingisi →':'🏁 Yakunlash')+
          '</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  clearInterval(ciTimer);
  S.ci.time=0;
  ciTimer=setInterval(function(){
    S.ci.time++;
    var c=$id('ci-clk');
    if(c){ c.textContent=fmt(S.ci.time); if(S.ci.time>300) c.style.color='var(--red)'; }
  },1000);

  if(synth){ synth.cancel(); var u=new SpeechSynthesisUtterance("Ikkinchi bosqich: texnik intervyu. Masalalarni hal qiling!"); u.lang='uz-UZ'; u.rate=0.9; setTimeout(function(){synth.speak(u);},500); }
}
function tabCI(e){
  if(e.key==='Tab'){
    e.preventDefault();
    var ta=e.target, s=ta.selectionStart;
    ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s);
    ta.selectionStart=ta.selectionEnd=s+2;
    S.ci.code=ta.value;
  }
}
function toggleHint(){
  var b=$id('hint-box'),btn=$id('hint-btn');
  if(!b) return;
  var show=b.style.display==='none';
  b.style.display=show?'block':'none';
  if(btn) btn.textContent=show?'🔼 Maslahatni yashirish':"💡 Maslahat ko'rish";
}
function runCI(){
  var ta=$id('ci-code'); if(!ta) return;
  S.ci.code=ta.value;
  S.ci.outType='running'; S.ci.out='⚡ Ishga tushirilmoqda...';
  var out=$id('ci-out'); if(out){out.textContent=S.ci.out;out.style.color='var(--yel)';}
  setTimeout(function(){
    try{
      var logs=[];
      var mc={log:function(){var a=Array.from(arguments);logs.push(a.map(function(x){return typeof x==='object'?JSON.stringify(x):String(x);}).join(' '));}};
      new Function('console',S.ci.code)(mc);
      var result=logs.join('\n');
      S.ci.out=result||'(chiqish yo\'q)'; S.ci.outType='success';
      var chals=CH[S.ivLevel]||CH.junior;
      var ch=chals[S.ci.idx];
      if(ch.ok&&ch.ok(result)){
        var sc=Math.max(60,100-Math.floor(S.ci.time/8));
        S.ci.scores[S.ci.idx]=sc;
        if(synth){var u=new SpeechSynthesisUtterance("Barakalla! Masala to'g'ri yechildi. "+sc+" ball!");u.lang='uz-UZ';u.rate=0.9;synth.speak(u);}
      }
    }catch(err){ S.ci.out='❌ Xato: '+err.message; S.ci.outType='error'; }
    rCoding();
  },500);
}
function resetCI(){
  var chals=CH[S.ivLevel]||CH.junior;
  S.ci.code=chals[S.ci.idx].code; S.ci.out=''; S.ci.outType='idle';
  rCoding();
}
function switchCI(i){
  var ta=$id('ci-code'); if(ta) S.ci.code=ta.value;
  var chals=CH[S.ivLevel]||CH.junior;
  S.ci.idx=i; S.ci.code=chals[i].code; S.ci.out=''; S.ci.outType='idle';
  rCoding();
}
function nextCI(){
  var ta=$id('ci-code'); if(ta) S.ci.code=ta.value;
  var chals=CH[S.ivLevel]||CH.junior;
  if(S.ci.idx+1<chals.length){
    S.ci.idx++; S.ci.code=chals[S.ci.idx].code; S.ci.out=''; S.ci.outType='idle';
    rCoding();
  }else{
    clearInterval(ciTimer);
    var filled=S.ci.scores.filter(function(x){return x!==undefined;});
    var avgC=filled.length>0?Math.round(filled.reduce(function(a,b){return a+b;},0)/chals.length):55;
    S.session.codingScore=avgC;
    S.session.total=Math.round(S.session.voiceScore*0.4+avgC*0.6);
    if(synth){synth.cancel();var u=new SpeechSynthesisUtterance("Intervyu tugadi! Umumiy ballingiz "+S.session.total+" ball. Natijalar sahifasiga o'tamiz.");u.lang='uz-UZ';u.rate=0.9;synth.speak(u);}
    setTimeout(function(){ go('results'); },1800);
  }
}
function exitCI(){ clearInterval(ciTimer); if(synth)synth.cancel(); go('setup'); }
</script>
<script>
// ===================== RESULTS =====================
var resRating=0;
function rResults(){
  var t=S.session.total||0, v=S.session.voiceScore||0, c=S.session.codingScore||0;
  var col=t>=85?'#43E97B':t>=70?'#4DC3FF':t>=50?'#FFB84D':'#FF4D6A';
  var grade=t>=85?'Ajoyib! 🎉':t>=70?'Yaxshi! 👍':t>=50?'Qoniqarli 📚':"Ko'proq Mashq 💪";
  var p=$id('page-results'); if(!p) return;
  p.innerHTML='<div class="res-wrap">'+
    '<div style="text-align:center;margin-bottom:48px">'+
      '<div style="margin-bottom:18px">'+
        '<div class="ring" id="score-ring" style="background:conic-gradient('+col+' 0deg, rgba(255,255,255,.05) 0deg 360deg)">'+
          '<div class="ring-in">'+
            '<div id="score-n" style="font-size:50px;font-weight:900;color:'+col+'">0</div>'+
            '<div style="font-size:12px;color:var(--t3)">/ 100 ball</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<h1 style="font-size:34px;font-weight:900;margin-bottom:8px">'+grade+'</h1>'+
      '<p style="color:var(--t2);font-size:16px;margin-bottom:22px">'+S.ivLevel+' darajasida intervyu yakunlandi</p>'+
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+
        '<button class="btn btn-pr" onclick="go(\'setup\')" style="padding:12px 28px">🔄 Qayta Urinish</button>'+
        '<button class="btn btn-sc" onclick="go(\'dashboard\')" style="padding:12px 28px">📊 Dashboard</button>'+
        '<button class="btn btn-sc" onclick="go(\'landing\')" style="padding:12px 28px">🏠 Bosh Sahifa</button>'+

       ["Sertifikat berasilarsizmi?","PRO obunachilarga har intervyu uchun PDF sertifikat."],
       ["Qanday to'lov usullari?","Payme va Click orqali o'zbek bank kartalariga."]].map(function(x){
        return '<div class="card" style="padding:16px;margin-bottom:9px"><div style="font-weight:600;margin-bottom:4px">❓ '+x[0]+'</div><div style="font-size:14px;color:var(--t2)">'+x[1]+'</div></div>';
      }).join('')+
    '</div>'+
  '</div>';
}
function buyPlan(name){
  if(name==='Bepul'){go('setup');return;}
  if(name==='Team'){alert("Bog'lanish: info@mockinterview.uz");return;}
  if(!S.user){mopen('auth','register');return;}
  S.payMethod=null; S.payStep=1; renderPay(); $id('m-pay').classList.add('open');
}
function renderPay(){
  var c=$id('pay-c'); if(!c) return;
  var amt=S.billing==='monthly'?'49,000':'399,000';
  if(!S.payMethod){
    c.innerHTML='<h3 style="font-size:18px;font-weight:700;margin-bottom:16px;text-align:center">To\'lov usulini tanlang</h3>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<button onclick="S.payMethod=\'payme\';renderPay()" style="background:linear-gradient(135deg,#00AABB,#00CCDD);border:none;border-radius:13px;padding:14px 18px;display:flex;align-items:center;gap:13px;cursor:pointer"><div style="width:40px;height:40px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#00AABB">P</div><div style="text-align:left"><div style="color:#fff;font-weight:700">Payme</div><div style="color:rgba(255,255,255,.8);font-size:12px">Karta orqali</div></div></button>'+
        '<button onclick="S.payMethod=\'click\';renderPay()" style="background:linear-gradient(135deg,#2196F3,#1565C0);border:none;border-radius:13px;padding:14px 18px;display:flex;align-items:center;gap:13px;cursor:pointer"><div style="width:40px;height:40px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#2196F3">C</div><div style="text-align:left"><div style="color:#fff;font-weight:700">Click</div><div style="color:rgba(255,255,255,.8);font-size:12px">Click ilovasi orqali</div></div></button>'+
      '</div>'+
      '<button onclick="mclose(\'pay\')" style="margin-top:12px;width:100%;background:transparent;border:1px solid var(--br);color:var(--t3);padding:11px;border-radius:9px;cursor:pointer">Bekor qilish</button>';
  }else if(S.payStep===1){
    c.innerHTML='<div style="text-align:center;margin-bottom:18px"><div style="font-size:34px;margin-bottom:7px">'+(S.payMethod==='payme'?'💳':'📱')+'</div><h3 style="font-size:17px;font-weight:700">'+S.payMethod.charAt(0).toUpperCase()+S.payMethod.slice(1)+' orqali to\'lash</h3><p style="color:#43E97B;font-size:15px;font-weight:700;margin-top:6px">'+amt+' so\'m</p></div>'+
      '<label style="display:block;margin-bottom:7px;font-size:13px;color:var(--t2)">'+(S.payMethod==='payme'?'Karta raqami':'Telefon raqam')+'</label>'+
      '<input id="p-inp" class="inp" type="text" placeholder="'+(S.payMethod==='payme'?'0000 0000 0000 0000':'+998 XX XXX XX XX')+'" style="margin-bottom:13px">'+
      (S.payMethod==='payme'?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px"><input class="inp" placeholder="MM/YY"><input class="inp" type="password" placeholder="CVV"></div>':'')+
      '<button onclick="S.payStep=2;renderPay()" class="btn btn-pr" style="width:100%;justify-content:center">Tasdiqlash kodini yuborish →</button>';
  }else{
    c.innerHTML='<div style="text-align:center">'+
      '<p style="color:var(--t2);font-size:14px;margin-bottom:16px">SMS yuborildi. 6 xonali kodni kiriting:</p>'+
      '<div style="display:flex;gap:7px;justify-content:center;margin-bottom:16px">'+
        Array.from({length:6},function(){return '<input style="width:40px;height:48px;text-align:center;font-size:19px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--br);border-radius:9px;color:#fff;outline:none" maxlength="1">';}).join('')+
      '</div>'+
      '<button onclick="confirmPay()" class="btn btn-gr" style="width:100%;justify-content:center;padding:12px">✅ To\'lovni Tasdiqlash</button>'+
      '<button onclick="S.payStep=1;renderPay()" style="margin-top:9px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px">← Orqaga</button>'+
    '</div>';
  }
}
function confirmPay(){
  mclose('pay'); S.isPro=true;
  var pb=$id('pro-badge'); if(pb) pb.style.display='';
  $id('m-ok').classList.add('open');
  setTimeout(function(){$id('m-ok').classList.remove('open');},2600);
}
