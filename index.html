<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MockInterview Pro — Frontend Developer Interview Platform</title>
  <meta name="description" content="AI-powered mock interview platform for frontend developers. Practice HTML, CSS, JavaScript, React and more with voice AI." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React + ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX transpilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ===== CSS RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C63FF;
      --primary-dark: #5A52E0;
      --primary-light: #8B85FF;
      --secondary: #FF6584;
      --accent: #43E97B;
      --accent2: #38F9D7;
      --bg-dark: #0A0B14;
      --bg-card: #12131F;
      --bg-card2: #1A1B2E;
      --text-primary: #FFFFFF;
      --text-secondary: #A0A3B1;
      --text-muted: #6B6E82;
      --border: #2A2B3D;
      --success: #43E97B;
      --error: #FF4D6A;
      --warning: #FFB84D;
      --info: #4DC3FF;
      --gold: #FFD700;
      --radius: 16px;
      --radius-sm: 8px;
      --radius-lg: 24px;
      --shadow: 0 8px 32px rgba(108,99,255,0.15);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="src/app.jsx" data-type="module"></script>
</body>
</html>
